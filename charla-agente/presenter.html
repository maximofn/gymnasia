<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guion · El viaje del arroz</title>
<style>
  :root {
    --bg: #07090D;
    --surface: #141820;
    --border: #252B35;
    --text: #F4F7FB;
    --muted: #A6AFBC;
    --lime: #CBFF1A;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: grid; grid-template-rows: auto 1fr auto; padding-inline: 32px; padding-block: 22px; gap: 18px; box-sizing: border-box; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 24px; }
  #section { font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lime); font-family: ui-monospace, Menlo, monospace; }
  #station { font-size: 20px; font-weight: 600; color: var(--muted); }
  .spacer { flex: 1; }
  #count, #timer, #clock { font-family: ui-monospace, Menlo, monospace; font-size: 22px; font-variant-numeric: tabular-nums; }
  #timer { color: var(--lime); cursor: pointer; }
  #count { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 28px; min-height: 0; }
  #now { font-size: clamp(22px, 2.3vw, 32px); line-height: 1.5; overflow-y: auto; max-width: 62ch; }
  #now p { margin: 0 0 0.8em; }
  #now .dir, #next .dir { color: var(--muted); font-style: italic; font-size: 0.82em; }
  aside { border-left: 1px solid var(--border); padding-left: 24px; overflow-y: auto; min-width: 0; }
  aside h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #next { font-size: 18px; line-height: 1.5; color: var(--muted); }
  #next p { margin: 0 0 0.6em; }
  footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font: inherit; font-size: 17px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 14px; margin-left: auto; }
  .qlist { display: grid; gap: 4px; }
  .qlist button { text-align: left; font-size: 15px; padding: 6px 10px; border-radius: 8px; line-height: 1.3; }
  .qlist button.cur { border-color: var(--lime); color: var(--lime); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--border); padding-top: 16px; } }
</style>
</head>
<body>
<header>
  <span id="section"></span>
  <span id="station"></span>
  <span class="spacer"></span>
  <span id="count"></span>
  <span id="timer" title="Pulsa para reiniciar">00:00</span>
  <span id="clock"></span>
</header>
<main>
  <section id="now" aria-live="polite"></section>
  <aside>
    <h2 id="asideTitle">Siguiente</h2>
    <div id="next"></div>
  </aside>
</main>
<footer>
  <button id="prev" type="button">← Anterior</button>
  <button id="nextBtn" type="button">Siguiente →</button>
  <span id="status">Esperando a la proyección… (ábrela y pulsa P allí)</span>
</footer>

<script src="js/qa.js"></script>
<script src="js/steps.js"></script>
<script>
(function () {
  const N = STEPS.length;
  let index = 0;
  let started = null;
  const $ = (id) => document.getElementById(id);
  const target = () => window.opener && !window.opener.closed ? window.opener : null;

  function paragraphs(text) {
    return text.split(/\n\n+/).map((p) => {
      const esc = p.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      return /^\[.*\]$/.test(p.trim()) ? '<p class="dir">' + esc + "</p>" : "<p>" + esc.replace(/\[([^\]]+)\]/g, '<span class="dir">[$1]</span>') + "</p>";
    }).join("");
  }
  function sectionOf(i) {
    for (let j = i; j >= 0; j--) if (STEPS[j].section) return STEPS[j].section;
    return "";
  }
  function render() {
    const s = STEPS[index];
    $("section").textContent = sectionOf(index);
    $("station").textContent = STATIONS[s.station].name;
    $("count").textContent = (index + 1) + " / " + N;
    $("now").innerHTML = paragraphs(s.notes);
    $("now").scrollTop = 0;
    // En el turno de preguntas, la columna derecha es la lista para saltar a cada una.
    const qa = s.station === "qa";
    $("asideTitle").textContent = qa ? "Preguntas · I vuelve al índice" : "Siguiente";
    if (qa) {
      const cur = s.set.q;
      $("next").innerHTML = '<div class="qlist">' + QA.map((x, i) =>
        '<button type="button" data-go="' + (QA_INDEX + 1 + i) + '"' + (cur === i + 1 ? ' class="cur"' : "") + ">" + (i + 1) + ". " + x.short.replace(/</g, "&lt;") + "</button>").join("") + "</div>";
    } else {
      $("next").innerHTML = index + 1 < N ? paragraphs(STEPS[index + 1].notes) : "<p>Fin.</p>";
    }
  }
  $("next").addEventListener("click", (e) => {
    const b = e.target.closest("[data-go]");
    if (b) send({ type: "go", index: Number(b.dataset.go) });
  });
  function send(msg) {
    const w = target();
    if (w) { w.postMessage(msg, "*"); $("status").textContent = "Conectado con la proyección"; }
    else $("status").textContent = "Sin proyección: abre index.html y pulsa P allí";
  }
  function key(k) {
    if (!started) started = Date.now();
    send({ type: "key", key: k });
  }

  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "state") {
      index = e.data.index;
      render();
      $("status").textContent = "Conectado con la proyección";
    }
  });
  window.addEventListener("keydown", (e) => {
    const nav = ["ArrowRight", "PageDown", " ", "Enter", "ArrowDown", "ArrowLeft", "PageUp", "Backspace", "ArrowUp", "Home", "End", "b", "B", ".", "i", "I"];
    if (nav.includes(e.key) && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); key(e.key); }
  });
  $("prev").addEventListener("click", () => key("ArrowLeft"));
  $("nextBtn").addEventListener("click", () => key("ArrowRight"));
  $("timer").addEventListener("click", () => { started = Date.now(); });

  setInterval(() => {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    const sec = started ? Math.floor((Date.now() - started) / 1000) : 0;
    $("timer").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  }, 500);

  render();
  send({ type: "hello" });
})();
</script>
</body>
</html>
