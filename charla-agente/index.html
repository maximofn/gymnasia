<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El viaje del arroz</title>
<style>
  /* Colores del sistema de diseño de Gymnasia; el lima solo para el agente y lo que funciona. */
  :root {
    --bg: #07090D;
    --surface: #141820;
    --border: #252B35;
    --text: #F4F7FB;
    --muted: #A6AFBC;
    --lime: #CBFF1A;
    --red: #FF5A5F;
    --amber: #FFB020;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 600; font-size: 20px; line-height: 1.25; color: var(--text); visibility: hidden; opacity: 0; will-change: transform, opacity; }
  .lbl.tag { background: rgba(20, 24, 32, 0.88); border: 1px solid var(--border); padding: 7px 14px; border-radius: 999px; }
  .lbl.mini { font-size: 14px; font-weight: 500; padding: 4px 10px; color: var(--muted); }
  .lbl.big { font-size: clamp(36px, 4.4vw, 64px); font-weight: 800; letter-spacing: -0.02em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.7); }
  .lbl.big-tag { font-size: 26px; padding: 10px 20px; }
  .lbl.ok { color: var(--lime); border-color: rgba(203, 255, 26, 0.45); }
  .lbl.bad { color: var(--red); border-color: rgba(255, 90, 95, 0.5); }
  .lbl.amber { color: var(--amber); border-color: rgba(255, 176, 32, 0.5); }
  .lbl.bubble { background: var(--text); color: var(--bg); padding: 14px 20px; border-radius: 20px 20px 20px 6px; font-size: 22px; max-width: 460px; white-space: normal; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
  .lbl.bubble.ok-b { background: var(--lime); border-radius: 20px 20px 6px 20px; }
  .lbl.bubble.amber-b { background: var(--amber); }

  .lbl.form { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; width: 300px; box-shadow: 0 14px 50px rgba(0, 0, 0, 0.55); }
  .f-title { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-family: ui-monospace, Menlo, monospace; }
  .f-row { display: grid; grid-template-columns: 1fr auto 24px; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--border); font-size: 22px; transition: opacity .6s, color .4s; }
  .f-row span { color: var(--muted); font-weight: 500; }
  .f-row b { font-variant-numeric: tabular-nums; }
  .f-row i { font-style: normal; color: var(--lime); opacity: 0; transition: opacity .4s; }
  .form.invented .f-row.inv b { color: var(--red); }
  .form.checked .f-row.inv { opacity: 0.25; text-decoration: line-through; }
  .form.checked .f-row:not(.inv) i { opacity: 1; }

  .lbl.note { background: #E9EDF3; color: var(--bg); border-radius: 10px; padding: 12px 18px; font-size: 20px; }
  .note .n2 { color: #3D6B00; opacity: 0; transition: opacity .5s; margin-top: 4px; }
  .note.done .n2 { opacity: 1; }

  .lbl.panel { width: 380px; white-space: normal; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; }
  .p-title { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-family: ui-monospace, Menlo, monospace; margin-bottom: 8px; }
  .p-body { font-size: 21px; font-weight: 500; min-height: 4.2em; }
  .p-body.wait { color: var(--amber); font-style: italic; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--lime); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #chip { position: fixed; left: 28px; top: 24px; font-size: 18px; font-weight: 600; padding: 9px 16px; border-radius: 999px; background: rgba(20, 24, 32, 0.85); border: 1px solid var(--border); color: var(--muted); opacity: 0; transition: opacity .5s; }
  #chip.on { opacity: 1; }

  #title { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; pointer-events: none; opacity: 0; transition: opacity 1s; background: radial-gradient(ellipse at center, rgba(7, 9, 13, 0.82) 0%, rgba(7, 9, 13, 0.55) 45%, rgba(7, 9, 13, 0) 75%); }
  #title.on { opacity: 1; }
  #title .name { font-size: clamp(48px, 7vw, 108px); font-weight: 800; letter-spacing: -0.03em; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
  #title .role { font-size: clamp(22px, 2.4vw, 34px); color: var(--muted); font-weight: 500; }
  #title .brand { margin-top: 18px; font-size: clamp(26px, 3vw, 42px); font-weight: 800; color: var(--lime); letter-spacing: 0.02em; }

  #thanks { position: fixed; inset: 0; display: grid; place-content: center; background: var(--bg); opacity: 0; transition: opacity 1.6s; pointer-events: none; }
  #thanks.on { opacity: 1; }
  #thanks div { font-size: clamp(56px, 8vw, 120px); font-weight: 800; letter-spacing: -0.03em; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .7s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  #fade { position: fixed; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; }
  #fade.on { animation: fade 1.1s ease-out; }
  @keyframes fade { 0% { opacity: 1; } 100% { opacity: 0; } }
  #black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #black.on { opacity: 1; }

  #hint { position: fixed; right: 24px; bottom: 20px; font-size: 14px; color: var(--muted); background: rgba(20, 24, 32, 0.85); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; }
  #hint kbd { font-family: ui-monospace, Menlo, monospace; color: var(--text); }

  @media (prefers-reduced-motion: reduce) { #flash.on { animation: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Escena 3D de la charla"></canvas>
<div id="labels"></div>
<div id="chip"></div>
<div id="title">
  <div class="name">Máximo Fernández</div>
  <div class="role">Desarrollador de IA</div>
  <div class="brand">Gymnasia</div>
</div>
<div id="thanks"><div>Gracias</div></div>
<div id="flash"></div>
<div id="fade"></div>
<div id="black"></div>
<div id="hint"><kbd>→</kbd> avanzar · <kbd>←</kbd> volver · <kbd>P</kbd> guion · <kbd>F</kbd> pantalla completa · <kbd>B</kbd> negro</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/steps.js"></script>
<script src="js/world.js"></script>
<script src="js/main.js"></script>
</body>
</html>
