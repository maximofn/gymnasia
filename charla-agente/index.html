<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El viaje del arroz</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* Colores del sistema de diseño de Gymnasia; el lima solo para el agente y lo que funciona. */
  :root {
    --bg: #07090D;
    --surface: #141820;
    --border: #252B35;
    --text: #F4F7FB;
    --muted: #A6AFBC;
    --lime: #CBFF1A;
    --red: #FF5A5F;
    --amber: #FFB020;
    --glass: rgba(16, 20, 27, 0.62);
    --edge: rgba(255, 255, 255, 0.09);
    --font: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; transition: filter 1.2s ease; }
  #scene.blurred { filter: blur(7px) brightness(0.55); }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* Etiquetas ancladas a la escena. main.js las mueve y las funde. */
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 500; font-size: 21px; line-height: 1.25; letter-spacing: -0.005em; color: var(--text); visibility: hidden; opacity: 0; will-change: transform, opacity, filter; }
  .lbl.tag { background: var(--glass); border: 1px solid var(--edge); padding: 8px 16px; border-radius: 999px; backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .lbl.mini { font-size: 16px; padding: 5px 12px; color: var(--muted); }
  .lbl.big { font-size: clamp(40px, 4.6vw, 72px); font-weight: 700; letter-spacing: -0.035em; text-shadow: 0 8px 40px rgba(0, 0, 0, 0.85); }
  .lbl.q { font-size: clamp(30px, 3.2vw, 50px); font-weight: 600; color: rgba(244, 247, 251, 0.82); letter-spacing: -0.03em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.8); }
  .lbl.big-tag { font-size: 27px; padding: 11px 22px; font-weight: 600; }
  .lbl.ok { color: var(--lime); border-color: rgba(203, 255, 26, 0.38); }
  .lbl.tag.ok::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); margin-right: 10px; vertical-align: 2px; }
  .lbl.big.ok, .lbl.q.ok { text-shadow: 0 0 40px rgba(203, 255, 26, 0.35), 0 8px 40px rgba(0, 0, 0, 0.8); }
  .lbl.bad { color: var(--red); border-color: rgba(255, 90, 95, 0.45); }
  .lbl.amber { color: var(--amber); border-color: rgba(255, 176, 32, 0.45); }
  .lbl.big.amber { font-size: clamp(70px, 8vw, 120px); }

  .lbl.bubble { background: rgba(236, 240, 246, 0.94); color: #0B0E13; padding: 15px 22px; border-radius: 22px 22px 22px 6px; font-size: 23px; max-width: 470px; white-space: normal; box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5); }
  .lbl.bubble.ok-b { background: var(--lime); border-radius: 22px 22px 6px 22px; box-shadow: 0 0 50px rgba(203, 255, 26, 0.22), 0 14px 44px rgba(0, 0, 0, 0.5); }
  .lbl.bubble.amber-b { background: var(--amber); }
  .lbl.bubble.quote { background: var(--glass); color: var(--text); border: 1px solid var(--edge); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-style: italic; }

  .card { background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; padding: 16px 20px; backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06); white-space: normal; }
  .card.lime { border-color: rgba(203, 255, 26, 0.45); box-shadow: 0 0 60px rgba(203, 255, 26, 0.12), 0 18px 50px rgba(0, 0, 0, 0.45); }
  .c-title { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-family: var(--mono); margin-bottom: 10px; }
  .card.lime .c-title { color: var(--lime); }
  .card pre { margin: 0; font-family: var(--mono); font-size: 16px; line-height: 1.45; color: var(--text); }
  .card pre em { font-style: normal; color: var(--lime); }
  .card.code { width: 330px; }

  .lbl.form { width: 330px; }
  .f-row { display: grid; grid-template-columns: 1fr auto 24px; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--edge); font-size: 23px; transition: opacity .6s, color .4s; }
  .f-row span { color: var(--muted); font-weight: 400; }
  .f-row b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .f-row i { font-style: normal; color: var(--lime); opacity: 0; transition: opacity .4s; }
  .form.invented .f-row.inv b { color: var(--red); }
  .form.checked .f-row.inv { opacity: 0.28; text-decoration: line-through; }
  .form.checked .f-row:not(.inv) i { opacity: 1; }

  .p-row { padding: 7px 0; border-top: 1px solid var(--edge); font-size: 19px; }
  .p-row.off { color: var(--muted); text-decoration: line-through; opacity: 0.6; }

  .lbl.note { background: #EEF1F5; color: #0B0E13; border-radius: 12px; padding: 13px 18px; font-size: 21px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); }
  .note .n2 { color: #3D6B00; opacity: 0; transition: opacity .5s; margin-top: 4px; font-weight: 600; }
  .note.done .n2 { opacity: 1; }

  .lbl.panel { width: 400px; }
  .p-body { font-size: 22px; font-weight: 400; min-height: 4.3em; line-height: 1.4; }
  .p-body.wait { color: var(--amber); font-style: italic; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--lime); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Capas fijas */
  #chip { position: fixed; left: 32px; top: 26px; display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 500; color: var(--muted); opacity: 0; transform: translateY(-6px); transition: opacity .6s, transform .6s; }
  #chip.on { opacity: 1; transform: none; }
  #chip b { color: var(--bg); background: var(--lime); font-weight: 700; font-size: 15px; padding: 4px 9px; border-radius: 7px; letter-spacing: 0.02em; }
  #progress { position: fixed; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, rgba(203, 255, 26, 0.15), var(--lime)); box-shadow: 0 0 14px rgba(203, 255, 26, 0.6); transition: width .8s cubic-bezier(.2, .8, .2, 1); }

  #title { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
  #title.on { opacity: 1; }
  #title .name { font-size: clamp(56px, 7.4vw, 118px); font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  #title .role { font-size: clamp(22px, 2.3vw, 34px); color: var(--muted); font-weight: 400; }
  #title .talk { margin-top: 26px; font-size: clamp(22px, 2.2vw, 32px); font-weight: 500; max-width: 26ch; margin-inline: auto; text-wrap: balance; }
  #title .brand { margin-top: 6px; font-size: clamp(18px, 1.6vw, 24px); font-weight: 700; color: var(--lime); letter-spacing: 0.24em; text-transform: uppercase; text-shadow: 0 0 30px rgba(203, 255, 26, 0.4); }
  #title > * { transform: translateY(14px); transition: transform 1.2s cubic-bezier(.2, .8, .2, 1); }
  #title.on > * { transform: none; }

  #thanks { position: fixed; inset: 0; display: grid; place-content: center; background: radial-gradient(ellipse at center, rgba(7, 9, 13, 0.6), var(--bg) 70%); opacity: 0; transition: opacity 1.8s; pointer-events: none; }
  #thanks.on { opacity: 1; }
  #thanks div { font-size: clamp(64px, 9vw, 140px); font-weight: 700; letter-spacing: -0.05em; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .8s ease-out; }
  @keyframes flash { 0% { opacity: .92; } 100% { opacity: 0; } }
  #fade { position: fixed; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; }
  #fade.on { animation: fade 1.2s ease-out; }
  @keyframes fade { 0% { opacity: 1; } 100% { opacity: 0; } }
  #black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #black.on { opacity: 1; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; color: var(--muted); font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; transition: opacity .8s; }
  #loading.done { opacity: 0; pointer-events: none; }

  #hint { position: fixed; right: 24px; bottom: 20px; font-size: 14px; color: var(--muted); background: var(--glass); border: 1px solid var(--edge); padding: 8px 14px; border-radius: 10px; }
  #hint kbd { font-family: var(--mono); color: var(--text); }

  @media (prefers-reduced-motion: reduce) { #flash.on { animation: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Escena 3D de la charla"></canvas>
<div id="labels"></div>
<div id="chip"></div>
<div id="title">
  <div class="name">Máximo Fernández</div>
  <div class="role">Desarrollador de IA</div>
  <div class="talk">Cómo desarrollar un agente en una app de gimnasio y nutrición</div>
  <div class="brand">Gymnasia</div>
</div>
<div id="thanks"><div>Gracias</div></div>
<div id="progress"></div>
<div id="flash"></div>
<div id="fade"></div>
<div id="black"></div>
<div id="loading">Cargando…</div>
<div id="hint"><kbd>→</kbd> avanzar · <kbd>←</kbd> volver · <kbd>P</kbd> guion · <kbd>F</kbd> pantalla completa · <kbd>B</kbd> negro</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/CopyShader.js"></script>
<script src="js/vendor/LuminosityHighPassShader.js"></script>
<script src="js/vendor/EffectComposer.js"></script>
<script src="js/vendor/MaskPass.js"></script>
<script src="js/vendor/RenderPass.js"></script>
<script src="js/vendor/ShaderPass.js"></script>
<script src="js/vendor/UnrealBloomPass.js"></script>
<script src="js/assets.js"></script>
<script src="js/steps.js"></script>
<script src="js/world.js"></script>
<script src="js/main.js"></script>
</body>
</html>
