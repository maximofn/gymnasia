[project]
name = "gymnasia-anthropic-proxy"
version = "0.1.0"
description = "Proxy CORS de Anthropic para depurar la app de Gymnasia en el navegador"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",
]

# Proyecto virtual: uv gestiona el entorno pero no intenta empaquetar el proxy,
# que es un unico fichero que se ejecuta directamente y no se instala.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
