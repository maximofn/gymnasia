name: Promote policy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Promotion operation"
        required: true
        type: choice
        options:
          - staging
          - production
      pr_number:
        description: "Open PR number (staging only)"
        required: false
        type: string
      bootstrap_main:
        description: "One-time Staging bootstrap from the current protected main commit"
        required: false
        default: false
        type: boolean
      candidate:
        description: "Immutable policy tag (production only)"
        required: false
        type: string
      critical:
        description: "Use the separately audited Production Critical path"
        required: false
        default: false
        type: boolean

concurrency:
  group: policy-promotion-${{ inputs.operation }}-${{ inputs.pr_number || inputs.candidate }}
  cancel-in-progress: false

jobs:
  validate-staging:
    if: inputs.operation == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      deployments: read
    outputs:
      source_commit: ${{ steps.pr.outputs.source_commit }}
      bootstrap: ${{ steps.pr.outputs.bootstrap }}
      candidate: ${{ steps.evidence.outputs.candidate }}

    steps:
      - name: Resolve an open PR or the one-time main bootstrap
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BOOTSTRAP_MAIN: ${{ inputs.bootstrap_main }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$BOOTSTRAP_MAIN" = "true"; then
            test -z "$PR_NUMBER" || { echo "bootstrap_main and pr_number are mutually exclusive"; exit 1; }
            test "$GITHUB_REF" = "refs/heads/main" || { echo "bootstrap_main must run from main"; exit 1; }
            SOURCE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            test "$SOURCE_COMMIT" = "$GITHUB_SHA" || { echo "bootstrap_main requires the current main HEAD"; exit 1; }
            test "$(gh api "repos/${GITHUB_REPOSITORY}/deployments?task=gymnasia-policy&per_page=1" --jq length)" = "0" \
              || { echo "bootstrap_main is disabled after the first policy deployment"; exit 1; }
          else
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "pr_number is required for staging"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
            test "$(jq -r .state /tmp/pr.json)" = "open"
            test "$(jq -r .base.ref /tmp/pr.json)" = "main"
            SOURCE_COMMIT="$(jq -r .head.sha /tmp/pr.json)"
          fi
          CHECKS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_COMMIT}/check-runs")"
          jq -e '.check_runs | any(.name == "prompt-policy" and .conclusion == "success")' <<<"$CHECKS"
          if test "$BOOTSTRAP_MAIN" != "true"; then
            STATUSES="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_COMMIT}/status")"
            jq -e '.statuses | any(.context == "gymnasia/owner-authorization" and .state == "success")' <<<"$STATUSES"
          fi
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$BOOTSTRAP_MAIN" >> "$GITHUB_OUTPUT"

      - name: Check out the exact untrusted commit without credentials
        env:
          SOURCE_COMMIT: ${{ steps.pr.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run the exact blocking health gate
        run: npm run check:health-safety

      - name: Generate non-authorizing report and candidate metadata
        id: evidence
        env:
          SOURCE_COMMIT: ${{ steps.pr.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy-candidate
          cp prompts/AGENTS.md /tmp/policy-candidate/policy.md
          cp policy/health-safety/runtime.json /tmp/policy-candidate/health-safety-runtime.json
          npm run report:health-safety -- --output /tmp/policy-candidate/health-safety-report.json
          POLICY_VERSION="$(jq -r .policyVersion policy/health-safety/manifest.json)"
          CANDIDATE="policy-v${POLICY_VERSION}-${SOURCE_COMMIT:0:12}"
          ASSET_SHA="$(sha256sum /tmp/policy-candidate/policy.md | cut -d' ' -f1)"
          RUNTIME_SHA="$(sha256sum /tmp/policy-candidate/health-safety-runtime.json | cut -d' ' -f1)"
          REPORT_SHA="$(sha256sum /tmp/policy-candidate/health-safety-report.json | cut -d' ' -f1)"
          test "$(jq -r .policyVersion /tmp/policy-candidate/health-safety-runtime.json)" = "$POLICY_VERSION"
          jq -e --arg digest "$ASSET_SHA" '
            .authorizing == false
            and .summary.failed == 0
            and .promptVersion == ("sha256:" + $digest)
          ' /tmp/policy-candidate/health-safety-report.json
          jq -n \
            --arg candidate "$CANDIDATE" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg policyVersion "$POLICY_VERSION" \
            --arg assetSha256 "$ASSET_SHA" \
            --arg runtimePolicySha256 "$RUNTIME_SHA" \
            --arg reportSha256 "$REPORT_SHA" \
            --arg sourcePr "${{ inputs.pr_number }}" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              schemaVersion: 2,
              candidate: $candidate,
              sourceCommit: $sourceCommit,
              policyVersion: $policyVersion,
              datasetVersion: $policyVersion,
              promptVersion: ("sha256:" + $assetSha256),
              assetSha256: $assetSha256,
              runtimePolicySha256: $runtimePolicySha256,
              healthSafetyReportSha256: $reportSha256,
              sourcePullRequest: (if $sourcePr == "" then null else ($sourcePr | tonumber) end),
              bootstrapMain: ($sourcePr == ""),
              owner: "maximofn",
              gate: {command: "npm run check:health-safety", passed: true, authorizingReport: false},
              workflowRunUrl: $runUrl
            }' > /tmp/policy-candidate/promotion-evidence.json
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg candidate "$CANDIDATE" \
            '{sourceCommit: $sourceCommit, candidate: $candidate}' \
            > /tmp/policy-candidate/source.json
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Upload validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-candidate-${{ steps.evidence.outputs.candidate }}
          path: /tmp/policy-candidate
          if-no-files-found: error
          retention-days: 7

  publish-staging:
    if: inputs.operation == 'staging'
    needs: validate-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Staging
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Download only the validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: policy-candidate-${{ needs.validate-staging.outputs.candidate }}
          path: /tmp/policy-candidate

      - name: Publish immutable prerelease and Staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.validate-staging.outputs.candidate }}
          SOURCE_COMMIT: ${{ needs.validate-staging.outputs.source_commit }}
          BOOTSTRAP_MAIN: ${{ needs.validate-staging.outputs.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/policy-candidate
          test "$(jq -r .candidate promotion-evidence.json)" = "$CANDIDATE"
          test "$(jq -r .sourceCommit promotion-evidence.json)" = "$SOURCE_COMMIT"
          test "$(jq -r .owner promotion-evidence.json)" = "maximofn"
          test "$(jq -r .gate.command promotion-evidence.json)" = "npm run check:health-safety"
          test "$(jq -r .gate.authorizingReport promotion-evidence.json)" = "false"
          if test "$BOOTSTRAP_MAIN" = "true"; then
            test "$(jq -r .bootstrapMain promotion-evidence.json)" = "true"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/deployments?task=gymnasia-policy&per_page=1" --jq length)" = "0" \
              || { echo "another policy deployment won the bootstrap race"; exit 1; }
          fi
          ASSET_SHA="$(sha256sum policy.md | cut -d' ' -f1)"
          RUNTIME_SHA="$(sha256sum health-safety-runtime.json | cut -d' ' -f1)"
          REPORT_SHA="$(sha256sum health-safety-report.json | cut -d' ' -f1)"
          test "$ASSET_SHA" = "$(jq -r .assetSha256 promotion-evidence.json)"
          test "$RUNTIME_SHA" = "$(jq -r .runtimePolicySha256 promotion-evidence.json)"
          test "$REPORT_SHA" = "$(jq -r .healthSafetyReportSha256 promotion-evidence.json)"
          gh release create "$CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "$CANDIDATE" \
            --notes "Immutable Gymnasia policy candidate validated by deterministic health-safety gates." \
            --draft \
            --prerelease
          gh release upload "$CANDIDATE" policy.md health-safety-runtime.json health-safety-report.json promotion-evidence.json \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$CANDIDATE" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE}/policy.md"
          RUNTIME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE}/health-safety-runtime.json"
          POLICY_VERSION="$(jq -r .policyVersion promotion-evidence.json)"
          jq -n \
            --arg ref "$SOURCE_COMMIT" \
            --arg candidate "$CANDIDATE" \
            --arg assetUrl "$ASSET_URL" \
            --arg assetSha256 "$ASSET_SHA" \
            --arg runtimePolicyUrl "$RUNTIME_URL" \
            --arg runtimePolicySha256 "$RUNTIME_SHA" \
            --arg policyVersion "$POLICY_VERSION" \
            --arg reportSha256 "$REPORT_SHA" \
            --arg workflowRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              ref: $ref,
              task: "gymnasia-policy",
              environment: "Staging",
              auto_merge: false,
              required_contexts: [],
              payload: {
                schemaVersion: 2,
                candidate: $candidate,
                sourceCommit: $ref,
                assetUrl: $assetUrl,
                assetSha256: $assetSha256,
                runtimePolicyUrl: $runtimePolicyUrl,
                runtimePolicySha256: $runtimePolicySha256,
                runtimePolicyVersion: $policyVersion,
                policyVersion: $policyVersion,
                datasetVersion: $policyVersion,
                promptVersion: ("sha256:" + $assetSha256),
                reportSha256: $reportSha256,
                workflowRunUrl: $workflowRunUrl
              }
            }' > /tmp/deployment.json
          DEPLOYMENT_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input /tmp/deployment.json --jq .id)"
          jq -n \
            --arg state success \
            --arg environment Staging \
            --arg environmentUrl "$ASSET_URL" \
            --arg logUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, environment: $environment, environment_url: $environmentUrl, log_url: $logUrl}' \
            > /tmp/deployment-status.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            --input /tmp/deployment-status.json >/dev/null

  validate-production:
    if: inputs.operation == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      staging_deployment_id: ${{ steps.candidate.outputs.staging_deployment_id }}

    steps:
      - name: Download candidate and verify prior Staging deployment
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^policy-v[0-9]{4}\.[0-9]{2}\.[0-9]+-[a-f0-9]{12}$ ]]
          mkdir -p /tmp/policy-production
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE}"
          curl -fsSL "$BASE/policy.md" -o /tmp/policy-production/policy.md
          curl -fsSL "$BASE/health-safety-runtime.json" -o /tmp/policy-production/health-safety-runtime.json
          curl -fsSL "$BASE/health-safety-report.json" -o /tmp/policy-production/health-safety-report.json
          curl -fsSL "$BASE/promotion-evidence.json" -o /tmp/policy-production/promotion-evidence.json
          SOURCE_COMMIT="$(jq -r .sourceCommit /tmp/policy-production/promotion-evidence.json)"
          test "$(jq -r .candidate /tmp/policy-production/promotion-evidence.json)" = "$CANDIDATE"
          test "$(jq -r .owner /tmp/policy-production/promotion-evidence.json)" = "maximofn"
          test "$(jq -r .gate.command /tmp/policy-production/promotion-evidence.json)" = "npm run check:health-safety"
          test "$(sha256sum /tmp/policy-production/policy.md | cut -d' ' -f1)" = "$(jq -r .assetSha256 /tmp/policy-production/promotion-evidence.json)"
          test "$(sha256sum /tmp/policy-production/health-safety-runtime.json | cut -d' ' -f1)" = "$(jq -r .runtimePolicySha256 /tmp/policy-production/promotion-evidence.json)"
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Staging&ref=${SOURCE_COMMIT}&task=gymnasia-policy&per_page=100" > /tmp/staging-deployments.json
          STAGING_ID="$(jq -r --arg candidate "$CANDIDATE" '
            [.[] | select((.payload.candidate // "") == $candidate)] | first | .id // empty
          ' /tmp/staging-deployments.json)"
          test -n "$STAGING_ID"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${STAGING_ID}/statuses" --jq '.[0].state')" = "success"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "staging_deployment_id=$STAGING_ID" >> "$GITHUB_OUTPUT"

      - name: Check out the exact source commit without credentials
        env:
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          cp /tmp/policy-production/policy.md prompts/AGENTS.md
          cp /tmp/policy-production/health-safety-runtime.json policy/health-safety/runtime.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Re-run the exact blocking health gate on the same content
        run: npm run check:health-safety

      - name: Generate fresh non-authorizing validation report
        shell: bash
        run: |
          set -euo pipefail
          npm run report:health-safety -- --output /tmp/policy-production/production-health-safety-report.json
          jq -e '.authorizing == false and .summary.failed == 0' /tmp/policy-production/production-health-safety-report.json

      - name: Upload validated production evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-production-${{ steps.candidate.outputs.candidate }}
          path: /tmp/policy-production
          if-no-files-found: error
          retention-days: 7

  publish-production:
    if: inputs.operation == 'production'
    needs: validate-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.critical && 'Production Critical' || 'Production' }}
    permissions:
      contents: read
      deployments: write
      statuses: write

    steps:
      - name: Download only validated production evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: policy-production-${{ needs.validate-production.outputs.candidate }}
          path: /tmp/policy-production

      - name: Promote the same immutable asset to Production
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.validate-production.outputs.candidate }}
          SOURCE_COMMIT: ${{ needs.validate-production.outputs.source_commit }}
          STAGING_DEPLOYMENT_ID: ${{ needs.validate-production.outputs.staging_deployment_id }}
          CRITICAL: ${{ inputs.critical }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/policy-production
          test "$(jq -r .candidate promotion-evidence.json)" = "$CANDIDATE"
          test "$(jq -r .sourceCommit promotion-evidence.json)" = "$SOURCE_COMMIT"
          test "$(jq -r .owner promotion-evidence.json)" = "maximofn"
          test "$(jq -r .gate.command promotion-evidence.json)" = "npm run check:health-safety"
          jq -e '.authorizing == false and .summary.failed == 0' production-health-safety-report.json
          ASSET_SHA="$(jq -r .assetSha256 promotion-evidence.json)"
          REPORT_SHA="$(jq -r .healthSafetyReportSha256 promotion-evidence.json)"
          RUNTIME_SHA="$(jq -r .runtimePolicySha256 promotion-evidence.json)"
          POLICY_VERSION="$(jq -r .policyVersion promotion-evidence.json)"
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE}/policy.md"
          RUNTIME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE}/health-safety-runtime.json"
          ENVIRONMENT_NAME="Production"
          test "$CRITICAL" != "true" || ENVIRONMENT_NAME="Production Critical"
          jq -n \
            --arg ref "$SOURCE_COMMIT" \
            --arg candidate "$CANDIDATE" \
            --arg assetUrl "$ASSET_URL" \
            --arg assetSha256 "$ASSET_SHA" \
            --arg runtimePolicyUrl "$RUNTIME_URL" \
            --arg runtimePolicySha256 "$RUNTIME_SHA" \
            --arg policyVersion "$POLICY_VERSION" \
            --arg reportSha256 "$REPORT_SHA" \
            --arg workflowRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg stagingDeploymentId "$STAGING_DEPLOYMENT_ID" \
            --arg environmentName "$ENVIRONMENT_NAME" \
            --argjson critical "$CRITICAL" \
            '{
              ref: $ref,
              task: "gymnasia-policy",
              environment: "Production",
              auto_merge: false,
              required_contexts: [],
              payload: {
                schemaVersion: 2,
                candidate: $candidate,
                sourceCommit: $ref,
                assetUrl: $assetUrl,
                assetSha256: $assetSha256,
                runtimePolicyUrl: $runtimePolicyUrl,
                runtimePolicySha256: $runtimePolicySha256,
                runtimePolicyVersion: $policyVersion,
                policyVersion: $policyVersion,
                datasetVersion: $policyVersion,
                promptVersion: ("sha256:" + $assetSha256),
                reportSha256: $reportSha256,
                workflowRunUrl: $workflowRunUrl,
                stagingDeploymentId: ($stagingDeploymentId | tonumber),
                critical: $critical,
                approval: {owner: "maximofn", environment: $environmentName, gateCommand: "npm run check:health-safety"}
              }
            }' > /tmp/deployment.json
          DEPLOYMENT_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input /tmp/deployment.json --jq .id)"
          jq -n \
            --arg state success \
            --arg environment Production \
            --arg environmentUrl "$ASSET_URL" \
            --arg logUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, environment: $environment, environment_url: $environmentUrl, log_url: $logUrl}' \
            > /tmp/deployment-status.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            --input /tmp/deployment-status.json >/dev/null
          jq -n \
            --arg state success \
            --arg context gymnasia/policy-promotion \
            --arg description "Exact policy commit promoted to Production" \
            --arg targetUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $targetUrl}' \
            > /tmp/status.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_COMMIT}" \
            --input /tmp/status.json >/dev/null
