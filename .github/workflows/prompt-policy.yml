name: Prompt policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prompt-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository without traversing legacy gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated policy artifacts and workflows
        id: policy
        run: npm run check:prompt-policy

      - name: Run policy unit, contract and property tests
        id: policy_tests
        run: npm run test:prompt-policy

      - name: Verify publishable Android permissions
        id: android_permissions
        run: npm run check:android-permissions

      - name: Run Android permission policy tests
        id: android_permissions_tests
        run: npm run test:android-permissions

      - name: Verify canonical health safety policy and bundled prompt
        id: health_safety
        run: npm run check:health-safety

      - name: Run health safety unit, contract, regression and property tests
        id: health_safety_tests
        run: npm run test:health-safety

      - name: Verify published data inventory
        id: data_inventory
        run: npm run check:data-inventory

      - name: Run data inventory tests
        id: data_inventory_tests
        run: npm run test:data-inventory

      - name: Verify generated privacy policy
        id: legal
        run: npm run check:legal

      - name: Run privacy policy tests
        id: legal_tests
        run: npm run test:legal

      - name: Verify bundled chat prompt snapshot
        id: snapshot
        run: npm run check:chat-prompt

      - name: Run deterministic agent suite
        id: deterministic
        run: npm test

      - name: Run OpenWiki automation tests
        id: openwiki
        run: npm run test:openwiki

      - name: Type-check mobile app
        id: types
        run: npm --workspace apps/mobile exec tsc --noEmit

      - name: Publish policy summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Prompt policy"
            echo
            echo "| Control | Result |"
            echo "| --- | --- |"
            echo "| Generated policy, CODEOWNERS and workflows | ${{ steps.policy.outcome }} |"
            echo "| Unit, contract and property tests | ${{ steps.policy_tests.outcome }} |"
            echo "| Publishable Android permissions | ${{ steps.android_permissions.outcome }} |"
            echo "| Android permission policy tests | ${{ steps.android_permissions_tests.outcome }} |"
            echo "| Health safety policy and prompt | ${{ steps.health_safety.outcome }} |"
            echo "| Health safety deterministic tests | ${{ steps.health_safety_tests.outcome }} |"
            echo "| Published data inventory | ${{ steps.data_inventory.outcome }} |"
            echo "| Data inventory tests | ${{ steps.data_inventory_tests.outcome }} |"
            echo "| Generated privacy policy | ${{ steps.legal.outcome }} |"
            echo "| Privacy policy tests | ${{ steps.legal_tests.outcome }} |"
            echo "| Bundled prompt parity | ${{ steps.snapshot.outcome }} |"
            echo "| Agent schema, tools and invariants | ${{ steps.deterministic.outcome }} |"
            echo "| OpenWiki automation | ${{ steps.openwiki.outcome }} |"
            echo "| TypeScript | ${{ steps.types.outcome }} |"
            echo
            echo "No prompt content, secrets, conversations or personal data are included in this summary."
          } >> "$GITHUB_STEP_SUMMARY"
