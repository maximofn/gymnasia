name: Catalog integrity tests

on:
  pull_request:
    paths:
      - "alimentos/**"
      - "productos_comerciales/**"
      - "recetas/**"
      - "ejercicios/**"
      - "scripts/catalogs/**"
      - "image-generation/generate_images.py"
      - "apps/mobile/App.tsx"
      - "apps/mobile/scripts/catalogs.e2e.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/catalog-tests.yml"
  push:
    branches: [main]
    paths:
      - "alimentos/**"
      - "productos_comerciales/**"
      - "recetas/**"
      - "ejercicios/**"
      - "scripts/catalogs/**"
      - "image-generation/generate_images.py"
      - "apps/mobile/App.tsx"
      - "apps/mobile/scripts/catalogs.e2e.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/catalog-tests.yml"

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository without traversing legacy gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Verify catalog contracts and generated files
        run: npm run check:catalogs

      - name: Run catalog regression tests
        run: npm run test:catalogs

      - name: Run catalog consumers without external services
        run: npm run test:catalogs:e2e
