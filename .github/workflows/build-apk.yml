name: Build Production APK & Publish Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile, retry or supersede the oldest failed version
        type: choice
        options: [reconcile, retry-failed, supersede-failed]
        default: reconcile
        required: true
      target_version:
        description: Required for retry/supersede (for example 1.31.3)
        type: string
        required: false
      reason:
        description: Required reason for retry/supersede
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/scripts/**"
      - "!apps/mobile/**/*.md"
      - "!apps/mobile/public/**"
      - "!apps/mobile/**/*.test.ts"
      - "!apps/mobile/**/*.test.tsx"

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  select-transaction:
    if: github.repository == 'maximofn/gymnasia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub only includes draft releases for tokens with push access.
      contents: write
    outputs:
      action: ${{ steps.select.outputs.action }}
      mode: ${{ steps.select.outputs.mode }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
      source_commit: ${{ steps.select.outputs.source_commit }}
      release_id: ${{ steps.select.outputs.release_id }}

    steps:
      - name: Require protected main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select oldest durable transaction
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          TARGET_VERSION: ${{ inputs.target_version || '' }}
          REASON: ${{ inputs.reason || '' }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          node scripts/production-release/release-transaction.mjs select-remote \
            --current-version "$CURRENT_VERSION" \
            --current-commit "$CURRENT_COMMIT" \
            --operation "$OPERATION" \
            --target-version "$TARGET_VERSION" \
            --reason "$REASON" \
            --output /tmp/production-release-selection.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve transaction selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-transaction-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/production-release-selection.json
          if-no-files-found: error
          retention-days: 30

  validate-production:
    needs: select-transaction
    if: needs.select-transaction.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout exact Production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select-transaction.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Production E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate exact source and re-run every Production gate
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.select-transaction.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-source -- \
            --profile production-apk \
            --artifact-type apk \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-version "$EXPECTED_VERSION" \
            --output /tmp/production-source-evidence.json
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/production-source-evidence.json
          if-no-files-found: warn
          retention-days: 30

  prepare-production:
    needs: [select-transaction, validate-production]
    if: >-
      always() &&
      needs.select-transaction.result == 'success' &&
      (needs.select-transaction.outputs.action == 'supersede' ||
       (needs.select-transaction.outputs.action == 'build' && needs.validate-production.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    permissions:
      contents: write

    outputs:
      release_id: ${{ needs.select-transaction.outputs.release_id || steps.draft.outputs.release_id }}
      should_build: ${{ steps.reserve.outputs.should_build }}
      artifact_name: ${{ steps.reserve.outputs.artifact_name }}
      artifact_run_id: ${{ steps.reserve.outputs.artifact_run_id }}

    steps:
      - name: Checkout immutable transaction source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select-transaction.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-controller

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Restore transaction selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-transaction-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/selection

      - name: Materialize transaction
        run: jq '.transaction' /tmp/selection/production-release-selection.json > /tmp/android-release-transaction.json

      - name: Apply authorized retry or supersession
        if: needs.select-transaction.outputs.mode == 'retry' || needs.select-transaction.outputs.mode == 'supersede'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          MODE: ${{ needs.select-transaction.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          REASON="$(jq -r '.reason' /tmp/selection/production-release-selection.json)"
          node .release-controller/scripts/production-release/release-transaction.mjs transition \
            --input /tmp/android-release-transaction.json \
            --output /tmp/android-release-transaction.json \
            --event "$MODE" \
            --reason "$REASON"
          gh release upload "$TAG" /tmp/android-release-transaction.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Stop after recording supersession
        if: needs.select-transaction.outputs.action == 'supersede'
        run: echo "La versión fallida quedó sustituida con un motivo auditable."

      - name: Install dependencies
        if: needs.select-transaction.outputs.action == 'build'
        run: npm ci

      - name: Restore verified source evidence
        if: needs.select-transaction.outputs.action == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/source

      - name: Prepare new immutable policy inputs
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/policy-promotion/prepare-policy-snapshot.mjs \
            --environment production \
            --github-env "$GITHUB_ENV"
          cp apps/mobile/agent/generated/policySnapshot.generated.json /tmp/production-policy-snapshot.json
          tar -czf /tmp/production-policy-bundle.tar.gz \
            apps/mobile/agent/generated/chatSystemPrompt.generated.ts \
            apps/mobile/agent/generated/healthSafetyPolicy.generated.ts \
            apps/mobile/agent/generated/policySnapshot.generated.json \
            apps/mobile/agent/generated/signedPolicySnapshot.generated.ts

      - name: Restore immutable policy inputs
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern production-policy-snapshot.json \
            --pattern production-policy-bundle.tar.gz \
            --dir /tmp/policy
          cp /tmp/policy/production-policy-snapshot.json /tmp/production-policy-snapshot.json
          cp /tmp/policy/production-policy-bundle.tar.gz /tmp/production-policy-bundle.tar.gz
          tar -xzf /tmp/production-policy-bundle.tar.gz -C .
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const p = require("/tmp/production-policy-snapshot.json");
            fs.appendFileSync(process.env.GITHUB_ENV,
              `APP_ENV=production\nPOLICY_CANDIDATE=${p.candidate}\nPOLICY_SHA256=${p.sha256}\nPOLICY_DEPLOYMENT_ID=${p.deploymentId}\n`);
          '

      - name: Create durable draft before local compilation
        id: draft
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          VERSION: ${{ needs.select-transaction.outputs.version }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          TRANSACTION_BASE64="$(base64 < /tmp/android-release-transaction.json | tr -d '\n')"
          {
            echo "## Gymnasia ${VERSION}"
            echo
            echo "Transacción Android durable para el commit \`${SOURCE_COMMIT}\`."
            echo
            echo "<!-- android-release-transaction:${TRANSACTION_BASE64} -->"
            echo "### Changes"
            # Sin tuberías a propósito. Con `set -o pipefail`, un `git ... | head -N`
            # puede tumbar el paso: `head` cierra la tubería al llegar a N, `git` recibe
            # SIGPIPE y sale con 141. Solo ocurre si la salida no cabe entera en el búfer
            # de la tubería, así que es un fallo latente que aparece sin avisar cuando
            # crece el historial. `--max-count` y `sed` recortan sin cerrar nada.
            LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
            if [ -n "$LATEST_TAG" ]; then
              git log "$LATEST_TAG"..HEAD --max-count=30 --pretty=format:'- %s'
            fi
            echo
            echo "### Install"
            # shellcheck disable=SC2016
            echo 'Download `gymnasia.apk` and install it on Android.'
          } > "$BODY_FILE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --title "Gymnasia ${VERSION}" \
            --notes-file "$BODY_FILE" --draft
          gh release upload "$TAG" \
            /tmp/android-release-transaction.json \
            /tmp/source/production-source-evidence.json \
            /tmp/production-policy-snapshot.json \
            /tmp/production-policy-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          # `select-transaction` calcula el release_id antes de que este borrador
          # exista, asi que en una version nueva llega vacio y la subida del APK
          # acaba en un 404 con el binario ya compilado. Se resuelve aqui.
          # No sirve `releases/tags/<tag>`: ese endpoint no encuentra borradores.
          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")] | first | .id // empty")"
          test -n "$RELEASE_ID" || {
            echo "::error::No se pudo resolver el id del borrador ${TAG}."; exit 1;
          }
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Refresh durable source evidence
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: |
          gh release upload "$TAG" /tmp/source/production-source-evidence.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Reserve local attempt durably before dispatch
        if: needs.select-transaction.outputs.action == 'build'
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inputs
          cp /tmp/android-release-transaction.json /tmp/production-policy-* /tmp/inputs/
          cp /tmp/source/production-source-evidence.json /tmp/inputs/
          STATE="$(jq -r '.state' /tmp/inputs/android-release-transaction.json)"
          if [ "$STATE" = prepared ]; then
            node .release-controller/scripts/production-release/local-controller.mjs baseline /tmp/inputs
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern previous-artifact-evidence.json --dir /tmp/inputs
          fi
          # Persist a recovered failure even when reserve refuses to dispatch.
          RESERVE_STATUS=0
          node .release-controller/scripts/production-release/local-controller.mjs reserve /tmp/inputs || RESERVE_STATUS=$?
          gh release upload "$TAG" /tmp/inputs/android-release-transaction.json \
            /tmp/inputs/previous-artifact-evidence.json --repo "$GITHUB_REPOSITORY" --clobber
          exit "$RESERVE_STATUS"

      - name: Preserve immutable local inputs
        if: needs.select-transaction.outputs.action == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-local-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/inputs/
          if-no-files-found: error
          retention-days: 30

  compile-android:
    needs: [select-transaction, validate-production, prepare-production]
    if: >-
      github.repository == 'maximofn/gymnasia' && github.ref == 'refs/heads/main' &&
      needs.validate-production.result == 'success' &&
      needs.validate-production.outputs.source_commit == needs.select-transaction.outputs.source_commit &&
      needs.prepare-production.outputs.should_build == 'true'
    runs-on: [self-hosted, linux, x64, wallabot, android-build, "gymnasia-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 110
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Checkout only the validated SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-controller

      - name: Restore immutable local inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-local-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs

      - name: Install locked dependencies and restore policy snapshot
        shell: bash
        run: |
          set -euo pipefail
          mv .release-controller "$RUNNER_TEMP/release-controller"
          node "$RUNNER_TEMP/release-controller/scripts/production-release/local-controller.mjs" check-inputs "$RUNNER_TEMP/inputs"
          npm ci --no-audit --no-fund
          tar -xzf "$RUNNER_TEMP/inputs/production-policy-bundle.tar.gz" -C .

      - name: Build synchronously inside the disposable VM
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node "$RUNNER_TEMP/release-controller/scripts/production-release/run-local-build.mjs" "$RUNNER_TEMP/inputs"

      - name: Transfer untrusted APK for independent verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare-production.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/gymnasia.apk
            ${{ runner.temp }}/local-build-metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove checkout and build material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          test -n "$RUNNER_TEMP" && test "$RUNNER_TEMP" != /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # The host destroys the VM overlay after every job, including hard kills.

  verify-and-release:
    needs: [select-transaction, validate-production, prepare-production, compile-android]
    if: >-
      always() && needs.prepare-production.result == 'success' &&
      needs.select-transaction.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore immutable inputs and durable transaction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-local-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/inputs

      - name: Restore verification paths
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-release/local-controller.mjs check-inputs /tmp/inputs
          cp /tmp/inputs/android-release-transaction.json /tmp/
          cp /tmp/inputs/production-policy-* /tmp/
          mkdir -p /tmp/source /tmp/quarantine
          cp /tmp/inputs/production-source-evidence.json /tmp/source/

      - name: Require successful compilation or immutable resume
        env:
          SHOULD_BUILD: ${{ needs.prepare-production.outputs.should_build }}
          BUILD_RESULT: ${{ needs.compile-android.result }}
        run: test "$SHOULD_BUILD" != true || test "$BUILD_RESULT" = success

      - name: Download APK to quarantine path
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare-production.outputs.artifact_name }}
          run-id: ${{ needs.prepare-production.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/quarantine

      - name: Require complete local result and bind it to the attempt
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/quarantine/gymnasia.apk && test ! -L /tmp/quarantine/gymnasia.apk
          test -f /tmp/quarantine/local-build-metadata.json
          test "$(find /tmp/quarantine -type f | wc -l)" = 2
          mv /tmp/quarantine/gymnasia.apk /tmp/gymnasia.apk.download
          node scripts/production-release/release-transaction.mjs transition \
            --input /tmp/android-release-transaction.json --output /tmp/android-release-transaction.json \
            --event finish-local --metadata /tmp/quarantine/local-build-metadata.json

      - name: Expose Android artifact tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ANDROID_BUILD_TOOLS"
          echo "$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Persist completed attempt before verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: gh release upload "$TAG" /tmp/android-release-transaction.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify quarantined Production APK
        env:
          HTTP_MIME: application/octet-stream
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-artifact -- \
            --artifact /tmp/gymnasia.apk.download \
            --published-filename gymnasia.apk \
            --http-mime "$HTTP_MIME" \
            --kind apk \
            --source-evidence /tmp/source/production-source-evidence.json \
            --snapshot /tmp/production-policy-snapshot.json \
            --build-metadata /tmp/quarantine/local-build-metadata.json \
            --transaction /tmp/android-release-transaction.json \
            --previous-evidence /tmp/inputs/previous-artifact-evidence.json \
            --output /tmp/production-artifact-evidence.json
          mv /tmp/gymnasia.apk.download gymnasia.apk

      - name: Mark transaction validated
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_SHA="$(jq -r '.artifact.sha256' /tmp/production-artifact-evidence.json)"
          ARTIFACT_SIZE="$(jq -r '.artifact.size' /tmp/production-artifact-evidence.json)"
          EVIDENCE_SHA="$(sha256sum /tmp/production-artifact-evidence.json | cut -d' ' -f1)"
          node scripts/production-release/release-transaction.mjs transition \
            --input /tmp/android-release-transaction.json \
            --output /tmp/android-release-transaction.json \
            --event validate \
            --artifact-sha256 "$ARTIFACT_SHA" \
            --artifact-size "$ARTIFACT_SIZE" \
            --evidence-sha256 "$EVIDENCE_SHA"

      - name: Attach verified APK and immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare-production.outputs.release_id }}
        run: |
          gh release upload "$TAG" \
            /tmp/android-release-transaction.json \
            /tmp/source/production-source-evidence.json \
            /tmp/production-artifact-evidence.json \
            /tmp/production-policy-snapshot.json \
            /tmp/production-policy-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/github-release.json
          EXISTING_APK_ID="$(jq -r '.assets[] | select(.name == "gymnasia.apk") | .id' /tmp/github-release.json)"
          if [ -n "$EXISTING_APK_ID" ]; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${EXISTING_APK_ID}"
          fi
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary @gymnasia.apk \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=gymnasia.apk" \
            > /tmp/github-apk-asset.json

      - name: Verify draft identity, bounds, MIME and evidence chain
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-production.outputs.release_id }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/github-release.json
          test "$(jq -r '.draft' /tmp/github-release.json)" = "true"
          test "$(jq -r '.target_commitish' /tmp/github-release.json)" = "$SOURCE_COMMIT"
          APK_POLICY="$(jq -c '.artifacts.apk' scripts/production-release/policy.json)"
          APK="$(jq -c '.assets[] | select(.name == "gymnasia.apk")' /tmp/github-release.json)"
          test "$(jq -r '.content_type' <<<"$APK")" = "$(jq -r '.githubMimeType' <<<"$APK_POLICY")"
          APK_SIZE="$(jq -r '.size' <<<"$APK")"
          test "$APK_SIZE" -ge "$(jq -r '.minBytes' <<<"$APK_POLICY")"
          test "$APK_SIZE" -le "$(jq -r '.maxBytes' <<<"$APK_POLICY")"
          for ASSET in android-release-transaction.json production-source-evidence.json production-artifact-evidence.json; do
            jq -e --arg name "$ASSET" '.assets[] | select(.name == $name)' /tmp/github-release.json >/dev/null
          done
          ASSET_DIGEST() {
            jq -r --arg name "$1" '.assets[] | select(.name == $name) | .digest' /tmp/github-release.json
          }
          test "$(ASSET_DIGEST gymnasia.apk)" = "sha256:$(jq -r '.artifact.sha256' /tmp/android-release-transaction.json)"
          test "$APK_SIZE" = "$(jq -r '.artifact.size' /tmp/android-release-transaction.json)"
          test "$(ASSET_DIGEST production-artifact-evidence.json)" = "sha256:$(jq -r '.artifact.evidenceSha256' /tmp/android-release-transaction.json)"
          test "$(ASSET_DIGEST production-source-evidence.json)" = "sha256:$(jq -r '.source.evidenceSha256' /tmp/production-artifact-evidence.json)"
          test "$(ASSET_DIGEST android-release-transaction.json)" = "sha256:$(sha256sum /tmp/android-release-transaction.json | cut -d' ' -f1)"
          for INPUT in production-policy-snapshot.json production-policy-bundle.tar.gz previous-artifact-evidence.json; do
            test "$(ASSET_DIGEST "$INPUT")" = "sha256:$(jq -r --arg name "$INPUT" '.attempts[-1].inputs[$name]' /tmp/android-release-transaction.json)"
          done
          test "$(jq -r '.source.commit' /tmp/production-artifact-evidence.json)" = "$SOURCE_COMMIT"
          test "$(jq -r '.result' /tmp/production-artifact-evidence.json)" = "passed"

      - name: Publish immutable APK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Preserve failed transaction without deleting the draft
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/android-release-transaction.json || cp /tmp/inputs/android-release-transaction.json /tmp/
          STATE="$(jq -r '.state' /tmp/android-release-transaction.json)"
          if [ "$STATE" = build-running ] || [ "$STATE" = build-finished ]; then
            node scripts/production-release/release-transaction.mjs transition \
              --input /tmp/android-release-transaction.json --output /tmp/android-release-transaction.json \
              --event fail-local --reason 'Falló la compilación o verificación local; requiere reintento manual motivado.'
          fi
          gh release upload "$TAG" /tmp/android-release-transaction.json --repo "$GITHUB_REPOSITORY" --clobber

  enqueue-next:
    needs: [select-transaction, prepare-production, verify-and-release]
    if: always() && (needs.verify-and-release.result == 'success' || (needs.prepare-production.result == 'success' && needs.select-transaction.outputs.action == 'supersede'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Enqueue later committed version in semver order
        env:
          GH_TOKEN: ${{ github.token }}
          PROCESSED_VERSION: ${{ needs.select-transaction.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          if node --input-type=module -e \
            'import { compareSemver } from "./scripts/production-release/production-release.mjs"; process.exit(compareSemver(process.argv[1], process.argv[2]) > 0 ? 0 : 1)' \
            "$CURRENT_VERSION" "$PROCESSED_VERSION"; then
            gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation=reconcile -f target_version= -f reason=
          fi
