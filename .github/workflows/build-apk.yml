name: Build Production APK & Publish Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/scripts/**"
      - "!apps/mobile/**/*.md"
      # apps/mobile/public/ solo lo consume `expo export --platform web`: EAS no lo
      # empaqueta en el AAB ni en el APK. Republicar la política de privacidad no
      # debe gastar una compilación de la cuota mensual (GYM-190).
      - "!apps/mobile/public/**"
      # Los tests no entran en el bundle: cambiarlos no produce un binario distinto.
      - "!apps/mobile/**/*.test.ts"
      - "!apps/mobile/**/*.test.tsx"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout exact Production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate exact source and re-run every Production gate
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-source -- \
            --profile production-apk \
            --artifact-type apk \
            --output /tmp/production-source-evidence.json
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-source-${{ github.sha }}
          path: /tmp/production-source-evidence.json
          if-no-files-found: warn
          retention-days: 30

  build-and-release:
    needs: validate-production
    runs-on: ubuntu-latest
    # `eas build` waits for the EAS build to finish; on the free tier the queue
    # alone can exceed 60 min, which cancelled the job mid-wait (build kept
    # queued on Expo but no release was published). Give the queue extra margin.
    timeout-minutes: 120
    environment: Production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore verified source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-source-${{ needs.validate-production.outputs.source_commit }}
          path: /tmp

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled chat prompt snapshot
        run: npm run check:chat-prompt

      - name: Resolve build profile
        id: profile
        run: |
          # La publicación automatizada solo puede producir la variante real de
          # producción. `production-apk` hereda APP_ENV=production y añade el
          # buildType instalable que exige este workflow.
          PROFILE="production-apk"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Prepare integrated snapshot from the Production policy channel
        run: |
          node scripts/policy-promotion/prepare-policy-snapshot.mjs \
            --environment production \
            --github-env "$GITHUB_ENV"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compute next version from conventional commits
        id: version
        run: |
          # Get latest version tag (or default to 0.0.0)
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT="0.0.0"
            REF="$(git rev-list --max-parents=0 HEAD)"
          else
            CURRENT="${LATEST_TAG#v}"
            # Strip SHA suffix if present (v1.0.0-abc1234 -> 1.0.0)
            CURRENT=$(echo "$CURRENT" | sed 's/-[a-f0-9]*$//')
            REF="$LATEST_TAG"
          fi

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Analyze commits since last tag
          BUMP="none"
          while IFS= read -r MSG; do
            if echo "$MSG" | grep -qiE "BREAKING[ -]CHANGE|^[a-z]+(\(.*\))?!:"; then
              BUMP="major"
              break
            elif echo "$MSG" | grep -qE "^feat(\(.*\))?:"; then
              [ "$BUMP" != "major" ] && BUMP="minor"
            elif echo "$MSG" | grep -qE "^fix(\(.*\))?:"; then
              [ "$BUMP" = "none" ] && BUMP="patch"
            fi
          done < <(git log "$REF"..HEAD --pretty=format:"%s" 2>/dev/null)

          # Default to patch if no conventional commits found but workflow was triggered
          [ "$BUMP" = "none" ] && BUMP="patch"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEXT}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT -> $NEXT ($BUMP)"

      - name: Update version in app.json
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          jq --arg v "$NEXT_VERSION" '.expo.version = $v' apps/mobile/app.json > /tmp/app.json
          mv /tmp/app.json apps/mobile/app.json
          echo "Updated app.json to $NEXT_VERSION"

      - name: Build APK on EAS (waits for completion)
        id: build
        env:
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          cd apps/mobile
          eas build \
            --platform android \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --json > /tmp/eas-build.json
          cat /tmp/eas-build.json | jq .
          APK_URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' /tmp/eas-build.json)
          if [ -z "$APK_URL" ]; then
            BUILD_ID=$(jq -r '.[0].id' /tmp/eas-build.json)
            echo "Build finished but no artifact URL in JSON. Fetching from build:view..."
            eas build:view "$BUILD_ID" --json > /tmp/eas-view.json
            APK_URL=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' /tmp/eas-view.json)
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "APK URL: $APK_URL"

      - name: Download APK
        env:
          APK_URL: ${{ steps.build.outputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_URL" || { echo "::error::EAS no devolvió una URL de artefacto."; exit 1; }
          curl --fail --location "$APK_URL" --output gymnasia.apk
          test -s gymnasia.apk || { echo "::error::El artefacto descargado está vacío."; exit 1; }
          ls -lh gymnasia.apk

      - name: Expose Android artifact tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ANDROID_BUILD_TOOLS"
          echo "$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify Production APK and generate immutable evidence
        run: |
          npm run verify:production-artifact -- \
            --artifact gymnasia.apk \
            --kind apk \
            --source-evidence /tmp/production-source-evidence.json \
            --snapshot apps/mobile/agent/generated/policySnapshot.generated.json \
            --build-metadata /tmp/eas-build.json \
            --output /tmp/production-artifact-evidence.json

      - name: Preserve verified APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-apk-${{ needs.validate-production.outputs.source_commit }}
          path: |
            gymnasia.apk
            /tmp/production-source-evidence.json
            /tmp/production-artifact-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            REF="$(git rev-list --max-parents=0 HEAD)"
          else
            REF="$LATEST_TAG"
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            git log "$REF"..HEAD --pretty=format:"- %s" 2>/dev/null | head -30
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft APK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          VERSION_BUMP: ${{ steps.version.outputs.bump }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          {
            echo "## Gymnasia ${NEXT_VERSION}"
            echo
            echo "**Build profile:** ${BUILD_PROFILE}"
            echo "**Version bump:** ${CURRENT_VERSION} -> ${NEXT_VERSION} (${VERSION_BUMP})"
            echo
            echo "### Changes"
            echo "$CHANGELOG"
            echo
            echo "### Install"
            echo 'Download `gymnasia.apk` and install it on Android.'
          } > "$BODY_FILE"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gymnasia ${NEXT_VERSION}" \
            --notes-file "$BODY_FILE" \
            --draft

      - name: Attach APK and evidence before publishing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            gymnasia.apk \
            /tmp/production-source-evidence.json \
            /tmp/production-artifact-evidence.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish immutable APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
