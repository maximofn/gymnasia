name: Build Android APK + AAB, Publish Release & Submit Play Internal

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile, retry or supersede the oldest failed version
        type: choice
        options: [reconcile, retry-failed, supersede-failed]
        default: reconcile
        required: true
      target_version:
        description: Required for retry/supersede (for example 1.44.0)
        type: string
        required: false
      reason:
        description: Required reason for retry/supersede
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/scripts/**"
      - "!apps/mobile/**/*.md"
      - "!apps/mobile/public/**"
      - "!apps/mobile/**/*.test.ts"
      - "!apps/mobile/**/*.test.tsx"

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  select-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub only includes draft releases for tokens with push access.
      contents: write
    outputs:
      action: ${{ steps.select.outputs.action }}
      mode: ${{ steps.select.outputs.mode }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
      source_commit: ${{ steps.select.outputs.source_commit }}
      release_id: ${{ steps.select.outputs.release_id }}
      minimum_version_code: ${{ steps.select.outputs.minimum_version_code }}

    steps:
      - name: Require protected main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select oldest durable transaction
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          TARGET_VERSION: ${{ inputs.target_version || '' }}
          REASON: ${{ inputs.reason || '' }}
          PLAY_VERSION_CODE_FLOOR: ${{ vars.PLAY_VERSION_CODE_FLOOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAY_VERSION_CODE_FLOOR" =~ ^[0-9]+$ ]] || {
            echo "::error::Configura PLAY_VERSION_CODE_FLOOR con el mayor versionCode real de Play Console."; exit 1;
          }
          CURRENT_VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          node scripts/production-release/release-transaction.mjs select-remote \
            --current-version "$CURRENT_VERSION" \
            --current-commit "$CURRENT_COMMIT" \
            --play-version-code-floor "$PLAY_VERSION_CODE_FLOOR" \
            --operation "$OPERATION" \
            --target-version "$TARGET_VERSION" \
            --reason "$REASON" \
            --output /tmp/production-release-selection.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve transaction selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-transaction-selection-${{ github.run_id }}
          path: /tmp/production-release-selection.json
          if-no-files-found: error
          retention-days: 30

  validate-production:
    needs: select-transaction
    if: needs.select-transaction.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout exact Production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select-transaction.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Production E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate exact source once for AAB and APK
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.select-transaction.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-source -- \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-version "$EXPECTED_VERSION" \
            --output /tmp/production-source-evidence.json
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-source-${{ needs.select-transaction.outputs.version }}
          path: /tmp/production-source-evidence.json
          if-no-files-found: warn
          retention-days: 30

  build-and-release:
    needs: [select-transaction, validate-production]
    if: >-
      always() &&
      needs.select-transaction.result == 'success' &&
      (needs.select-transaction.outputs.action == 'supersede' ||
       (needs.select-transaction.outputs.action == 'build' && needs.validate-production.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: Play Internal
    permissions:
      contents: write

    steps:
      - name: Checkout immutable transaction source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select-transaction.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Restore transaction selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-transaction-selection-${{ github.run_id }}
          path: /tmp/selection

      - name: Materialize transaction
        run: jq '.transaction' /tmp/selection/production-release-selection.json > /tmp/android-release-transaction.json

      - name: Apply authorized retry or supersession
        if: needs.select-transaction.outputs.mode == 'retry' || needs.select-transaction.outputs.mode == 'supersede'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          MODE: ${{ needs.select-transaction.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          REASON="$(jq -r '.reason' /tmp/selection/production-release-selection.json)"
          node scripts/production-release/release-transaction.mjs transition \
            --input /tmp/android-release-transaction.json \
            --output /tmp/android-release-transaction.json \
            --event "$MODE" \
            --reason "$REASON"
          gh release upload "$TAG" /tmp/android-release-transaction.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Stop after recording supersession
        if: needs.select-transaction.outputs.action == 'supersede'
        run: echo "La versión fallida quedó sustituida con un motivo auditable."

      - name: Install dependencies
        if: needs.select-transaction.outputs.action == 'build'
        run: npm ci

      - name: Require isolated Play Internal EAS token
        if: needs.select-transaction.outputs.action == 'build'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo "::error::Falta EXPO_TOKEN en el environment Play Internal."; exit 1; }

      - name: Restore verified source evidence
        if: needs.select-transaction.outputs.action == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-source-${{ needs.select-transaction.outputs.version }}
          path: /tmp/source

      - name: Prepare new immutable policy inputs
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/policy-promotion/prepare-policy-snapshot.mjs \
            --environment production \
            --github-env "$GITHUB_ENV"
          cp apps/mobile/agent/generated/policySnapshot.generated.json /tmp/production-policy-snapshot.json
          tar -czf /tmp/production-policy-bundle.tar.gz \
            apps/mobile/agent/generated/chatSystemPrompt.generated.ts \
            apps/mobile/agent/generated/healthSafetyPolicy.generated.ts \
            apps/mobile/agent/generated/policySnapshot.generated.json \
            apps/mobile/agent/generated/signedPolicySnapshot.generated.ts

      - name: Restore immutable policy inputs
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern production-policy-snapshot.json \
            --pattern production-policy-bundle.tar.gz \
            --dir /tmp/policy
          cp /tmp/policy/production-policy-snapshot.json /tmp/production-policy-snapshot.json
          cp /tmp/policy/production-policy-bundle.tar.gz /tmp/production-policy-bundle.tar.gz
          tar -xzf /tmp/production-policy-bundle.tar.gz -C .
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const p = require("/tmp/production-policy-snapshot.json");
            fs.appendFileSync(process.env.GITHUB_ENV,
              `APP_ENV=production\nPOLICY_CANDIDATE=${p.candidate}\nPOLICY_SHA256=${p.sha256}\nPOLICY_DEPLOYMENT_ID=${p.deploymentId}\n`);
          '

      - name: Create durable draft before EAS
        id: draft
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          VERSION: ${{ needs.select-transaction.outputs.version }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          TRANSACTION_BASE64="$(base64 < /tmp/android-release-transaction.json | tr -d '\n')"
          {
            echo "## Gymnasia ${VERSION}"
            echo
            echo "Transacción Android durable para el commit \`${SOURCE_COMMIT}\`."
            echo
            echo "El borrador se publicará cuando AAB, APK y Play Interno estén verificados."
            echo
            echo "<!-- android-release-transaction:${TRANSACTION_BASE64} -->"
          } > "$BODY_FILE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --title "Gymnasia ${VERSION}" \
            --notes-file "$BODY_FILE" --draft
          gh release upload "$TAG" \
            /tmp/android-release-transaction.json \
            /tmp/source/production-source-evidence.json \
            /tmp/production-policy-snapshot.json \
            /tmp/production-policy-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")] | first | .id // empty")"
          test -n "$RELEASE_ID" || { echo "::error::No se pudo resolver el id del borrador ${TAG}."; exit 1; }
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Refresh durable source evidence
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: gh release upload "$TAG" /tmp/source/production-source-evidence.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Setup pinned EAS CLI
        if: needs.select-transaction.outputs.action == 'build'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Adopt or build AAB first, then APK with the reserved versionCode
        if: needs.select-transaction.outputs.action == 'build'
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          VERSION: ${{ needs.select-transaction.outputs.version }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
          APP_ENV: production
        shell: bash
        run: |
          set -euo pipefail

          persist_transaction() {
            gh release upload "$TAG" /tmp/android-release-transaction.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          }

          list_builds() {
            printf '[]' > /tmp/eas-builds.json
            local offset=0
            while true; do
              if ! (cd apps/mobile && eas build:list --platform android \
                --limit 50 --offset "$offset" --json) > /tmp/eas-build-page.json; then
                cat /tmp/eas-build-page.json >&2 || true
                return 1
              fi
              jq -e 'type == "array"' /tmp/eas-build-page.json >/dev/null
              local size
              size="$(jq 'length' /tmp/eas-build-page.json)"
              jq -s 'add' /tmp/eas-builds.json /tmp/eas-build-page.json > /tmp/eas-builds.next.json
              mv /tmp/eas-builds.next.json /tmp/eas-builds.json
              [ "$size" -lt 50 ] && break
              offset=$((offset + 50))
            done
          }

          ensure_build() {
            local leg="$1"
            local profile="$2"
            local state build_id attempt message status artifact_url deadline
            state="$(jq -r --arg leg "$leg" '.legs[$leg].state' /tmp/android-release-transaction.json)"
            build_id="$(jq -r --arg leg "$leg" '.legs[$leg].attempts[-1].buildId // empty' /tmp/android-release-transaction.json)"
            if [ "$state" = "prepared" ] || [ "$state" = "intent" ]; then
              if [ "$state" = "intent" ]; then
                message="$(jq -r --arg leg "$leg" '.legs[$leg].intent.message' /tmp/android-release-transaction.json)"
              else
                attempt="$(jq -r --arg leg "$leg" '(.legs[$leg].intent.number // 0) + 1' /tmp/android-release-transaction.json)"
                message="android-v${VERSION}-${leg}-attempt-${attempt}"
              fi
              list_builds
              node scripts/production-release/eas-release.mjs select-build \
                --input /tmp/eas-builds.json \
                --profile "$profile" \
                --version "$VERSION" \
                --commit "$SOURCE_COMMIT" \
                --message "$message" \
                --output /tmp/eas-adopted-build.json
              build_id="$(jq -r '.id // empty' /tmp/eas-adopted-build.json)"
              if [ -z "$build_id" ]; then
                if [ "$state" = "intent" ]; then
                  node scripts/production-release/release-transaction.mjs transition \
                    --input /tmp/android-release-transaction.json \
                    --output /tmp/android-release-transaction.json \
                    --event fail --leg "$leg" \
                    --reason "La intención EAS de ${leg} no apareció en build:list; requiere revisión y retry-failed."
                  persist_transaction
                  echo "::error::La petición incierta de ${leg} no se repetirá automáticamente."
                  exit 75
                fi
                node scripts/production-release/release-transaction.mjs transition \
                  --input /tmp/android-release-transaction.json \
                  --output /tmp/android-release-transaction.json \
                  --event intent --leg "$leg" --message "$message"
                persist_transaction
                set +e
                (cd apps/mobile && eas build --platform android --profile "$profile" \
                  --message "$message" --non-interactive --no-wait --json) > /tmp/eas-created-build.json
                CREATE_EXIT=$?
                set -e
                build_id="$(jq -r 'if type == "array" then .[0].id else .id end // empty' /tmp/eas-created-build.json 2>/dev/null || true)"
                if [ -z "$build_id" ]; then
                  for _ in 1 2 3 4 5 6; do
                    list_builds
                    node scripts/production-release/eas-release.mjs select-build \
                      --input /tmp/eas-builds.json \
                      --profile "$profile" \
                      --version "$VERSION" \
                      --commit "$SOURCE_COMMIT" \
                      --message "$message" \
                      --output /tmp/eas-adopted-build.json
                    build_id="$(jq -r '.id // empty' /tmp/eas-adopted-build.json)"
                    [ -n "$build_id" ] && break
                    sleep 10
                  done
                fi
                if [ -z "$build_id" ]; then
                  node scripts/production-release/release-transaction.mjs transition \
                    --input /tmp/android-release-transaction.json \
                    --output /tmp/android-release-transaction.json \
                    --event fail --leg "$leg" \
                    --reason "No se confirmó la petición EAS de ${leg} (salida ${CREATE_EXIT}); requiere revisión y retry-failed."
                  persist_transaction
                  cat /tmp/eas-created-build.json >&2 || true
                  echo "::error::No se confirmó ${leg}; la intención durable impide repetirla automáticamente."
                  exit 75
                fi
              fi
              test -n "$build_id" || { echo "::error::EAS no devolvió build ID para ${leg}."; exit 1; }
              node scripts/production-release/release-transaction.mjs transition \
                --input /tmp/android-release-transaction.json \
                --output /tmp/android-release-transaction.json \
                --event submit --leg "$leg" --build-id "$build_id"
              persist_transaction
            fi

            deadline=$((SECONDS + 6300))
            : > "/tmp/eas-${leg}-view.last-error"
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! (cd apps/mobile && eas build:view "$build_id" --json \
                > "/tmp/eas-${leg}-view.json" 2> "/tmp/eas-${leg}-view.err"); then
                cat "/tmp/eas-${leg}-view.err" > "/tmp/eas-${leg}-view.last-error" 2>/dev/null || true
                sleep 30
                continue
              fi
              status="$(jq -r '.status | ascii_upcase' "/tmp/eas-${leg}-view.json")"
              artifact_url="$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' "/tmp/eas-${leg}-view.json")"
              args=(--input /tmp/android-release-transaction.json --output /tmp/android-release-transaction.json \
                --event observe --leg "$leg" --status "$status")
              if [ -n "$artifact_url" ]; then args+=(--artifact-url "$artifact_url"); fi
              if [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
                args+=(--reason "EAS terminó ${leg} en ${status}; consulta el build ${build_id}.")
              fi
              node scripts/production-release/release-transaction.mjs transition "${args[@]}"
              persist_transaction
              if [ "$status" = "FINISHED" ]; then
                echo "${leg}_id=${build_id}" >> "$GITHUB_OUTPUT"
                echo "${leg}_url=${artifact_url}" >> "$GITHUB_OUTPUT"
                return
              fi
              if [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
                echo "::error::${leg} terminó en ${status}; requiere retry-failed o supersede-failed con motivo."
                exit 1
              fi
              sleep 30
            done
            echo "::error::La espera de ${leg} terminó; el build ${build_id} queda persistido para reconciliar."
            tail -c 4000 "/tmp/eas-${leg}-view.last-error" >&2 || true
            exit 75
          }

          ensure_build aab production
          ensure_build apk production-apk

      - name: Download AAB and APK to quarantine paths
        if: needs.select-transaction.outputs.action == 'build'
        id: download
        env:
          AAB_URL: ${{ steps.builds.outputs.aab_url }}
          APK_URL: ${{ steps.builds.outputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          for LEG in aab apk; do
            URL_VAR="${LEG^^}_URL"
            URL="${!URL_VAR}"
            test -n "$URL" || { echo "::error::EAS no devolvió URL para ${LEG}."; exit 1; }
            curl --fail --location --dump-header "/tmp/${LEG}-response.headers" \
              "$URL" --output "/tmp/gymnasia.${LEG}.download"
            MIME="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); value=$2} END{print value}' "/tmp/${LEG}-response.headers")"
            test -n "$MIME" || { echo "::error::La descarga ${LEG} no declaró Content-Type."; exit 1; }
            echo "${LEG}_http_mime=${MIME}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout trusted release controller
        if: needs.select-transaction.outputs.action == 'build'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-controller

      - name: Expose Android artifact tools and verify bundletool checksum
        if: needs.select-transaction.outputs.action == 'build'
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ANDROID_BUILD_TOOLS"
          echo "$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          BUNDLETOOL_URL="$(jq -r '.bundletool.url' .release-controller/scripts/production-release/policy.json)"
          BUNDLETOOL_SHA="$(jq -r '.bundletool.sha256' .release-controller/scripts/production-release/policy.json)"
          curl --fail --location "$BUNDLETOOL_URL" --output /tmp/bundletool.jar
          echo "${BUNDLETOOL_SHA}  /tmp/bundletool.jar" | sha256sum --check --strict

      - name: Verify both quarantined Production artifacts
        if: needs.select-transaction.outputs.action == 'build'
        env:
          AAB_HTTP_MIME: ${{ steps.download.outputs.aab_http_mime }}
          APK_HTTP_MIME: ${{ steps.download.outputs.apk_http_mime }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix .release-controller run verify:production-artifact -- \
            --artifact /tmp/gymnasia.aab.download \
            --published-filename gymnasia.aab \
            --http-mime "$AAB_HTTP_MIME" \
            --kind aab \
            --profile production \
            --bundletool /tmp/bundletool.jar \
            --source-evidence /tmp/source/production-source-evidence.json \
            --snapshot /tmp/production-policy-snapshot.json \
            --build-metadata /tmp/eas-aab-view.json \
            --output /tmp/production-aab-evidence.json
          npm --prefix .release-controller run verify:production-artifact -- \
            --artifact /tmp/gymnasia.apk.download \
            --published-filename gymnasia.apk \
            --http-mime "$APK_HTTP_MIME" \
            --kind apk \
            --profile production-apk \
            --source-evidence /tmp/source/production-source-evidence.json \
            --snapshot /tmp/production-policy-snapshot.json \
            --build-metadata /tmp/eas-apk-view.json \
            --output /tmp/production-apk-evidence.json
          mv /tmp/gymnasia.aab.download gymnasia.aab
          mv /tmp/gymnasia.apk.download gymnasia.apk

      - name: Mark both artifacts validated with one shared versionCode
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          AAB_CODE="$(jq -r '.artifact.versionCode' /tmp/production-aab-evidence.json)"
          APK_CODE="$(jq -r '.artifact.versionCode' /tmp/production-apk-evidence.json)"
          test "$AAB_CODE" = "$APK_CODE" || { echo "::error::AAB y APK no comparten versionCode."; exit 1; }
          for LEG in aab apk; do
            EVIDENCE="/tmp/production-${LEG}-evidence.json"
            node scripts/production-release/release-transaction.mjs transition \
              --input /tmp/android-release-transaction.json \
              --output /tmp/android-release-transaction.json \
              --event validate --leg "$LEG" \
              --artifact-sha256 "$(jq -r '.artifact.sha256' "$EVIDENCE")" \
              --artifact-size "$(jq -r '.artifact.size' "$EVIDENCE")" \
              --evidence-sha256 "$(sha256sum "$EVIDENCE" | cut -d' ' -f1)" \
              --version-name "$(jq -r '.artifact.versionName' "$EVIDENCE")" \
              --version-code "$(jq -r '.artifact.versionCode' "$EVIDENCE")"
          done
          gh release upload "$TAG" \
            /tmp/android-release-transaction.json \
            /tmp/production-aab-evidence.json \
            /tmp/production-apk-evidence.json \
            gymnasia.aab \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload verified APK with Android MIME
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.select-transaction.outputs.release_id || steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/github-release.json
          EXISTING_APK_ID="$(jq -r '.assets[] | select(.name == "gymnasia.apk") | .id' /tmp/github-release.json)"
          if [ -n "$EXISTING_APK_ID" ]; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${EXISTING_APK_ID}"
          fi
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary @gymnasia.apk \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=gymnasia.apk" \
            > /tmp/github-apk-asset.json

      - name: Adopt, retry or create exactly one Play Internal submission
        if: needs.select-transaction.outputs.action == 'build'
        id: submit-play
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          MODE: ${{ needs.select-transaction.outputs.mode }}
          AAB_BUILD_ID: ${{ steps.builds.outputs.aab_id }}
          APP_ENV: production
        shell: bash
        run: |
          set -euo pipefail

          persist_transaction() {
            gh release upload "$TAG" /tmp/android-release-transaction.json --repo "$GITHUB_REPOSITORY" --clobber
          }

          list_submissions() {
            printf '[]' > /tmp/eas-submissions.json
            local offset=0
            while true; do
              if ! (cd apps/mobile && eas submit:list --platform android \
                --limit 50 --offset "$offset" --json) > /tmp/eas-submit-page.json; then
                cat /tmp/eas-submit-page.json >&2 || true
                return 1
              fi
              jq -e 'type == "array"' /tmp/eas-submit-page.json >/dev/null
              local size
              size="$(jq 'length' /tmp/eas-submit-page.json)"
              jq -s 'add' /tmp/eas-submissions.json /tmp/eas-submit-page.json > /tmp/eas-submissions.next.json
              mv /tmp/eas-submissions.next.json /tmp/eas-submissions.json
              [ "$size" -lt 50 ] && break
              offset=$((offset + 50))
            done
          }

          PLAY_STATE="$(jq -r '.legs.play.state' /tmp/android-release-transaction.json)"
          SUBMISSION_ID="$(jq -r '.legs.play.attempts[-1].submissionId // empty' /tmp/android-release-transaction.json)"
          PREVIOUS_STATUS="$(jq -r '.legs.play.attempts[-1].status // empty' /tmp/android-release-transaction.json)"
          if [ "$PLAY_STATE" = "prepared" ] || [ "$PLAY_STATE" = "intent" ]; then
            list_submissions
            node scripts/production-release/eas-release.mjs select-submission \
              --input /tmp/eas-submissions.json \
              --build-id "$AAB_BUILD_ID" \
              --track internal \
              --release-status completed \
              --output /tmp/eas-adopted-submission.json
            ADOPTED_ID="$(jq -r '.id // empty' /tmp/eas-adopted-submission.json)"
            ADOPTED_STATUS="$(jq -r '.status // empty | ascii_upcase' /tmp/eas-adopted-submission.json)"

            if [ "$PLAY_STATE" = "intent" ] && [ -z "$ADOPTED_ID" ]; then
              node scripts/production-release/release-transaction.mjs transition \
                --input /tmp/android-release-transaction.json \
                --output /tmp/android-release-transaction.json \
                --event fail --leg play \
                --reason "La intención de submission no apareció en submit:list; requiere revisión y retry-failed."
              persist_transaction
              echo "::error::La submission incierta no se repetirá automáticamente."
              exit 75
            fi

            if [ "$PLAY_STATE" = "prepared" ] && [ "$MODE" = "retry" ] && [ -n "$SUBMISSION_ID" ] \
              && { [ "$PREVIOUS_STATUS" = "ERRORED" ] || [ "$PREVIOUS_STATUS" = "CANCELED" ]; } \
              && { [ -z "$ADOPTED_ID" ] || [ "$ADOPTED_STATUS" = "ERRORED" ] || [ "$ADOPTED_STATUS" = "CANCELED" ]; }; then
              node scripts/production-release/release-transaction.mjs transition \
                --input /tmp/android-release-transaction.json \
                --output /tmp/android-release-transaction.json \
                --event intent --leg play --build-id "$AAB_BUILD_ID"
              persist_transaction
              set +e
              (cd apps/mobile && eas submit:retry "$SUBMISSION_ID" --non-interactive --json) \
                > /tmp/eas-submit-retry.json 2>&1
              RETRY_EXIT=$?
              set -e
              if [ "$RETRY_EXIT" -ne 0 ]; then cat /tmp/eas-submit-retry.json >&2; fi
              for _ in 1 2 3 4 5 6; do
                list_submissions
                node scripts/production-release/eas-release.mjs select-submission \
                  --input /tmp/eas-submissions.json \
                  --build-id "$AAB_BUILD_ID" \
                  --track internal \
                  --release-status completed \
                  --output /tmp/eas-adopted-submission.json
                ADOPTED_ID="$(jq -r '.id // empty' /tmp/eas-adopted-submission.json)"
                ADOPTED_STATUS="$(jq -r '.status // empty | ascii_upcase' /tmp/eas-adopted-submission.json)"
                if [ -n "$ADOPTED_ID" ] && [ "$ADOPTED_STATUS" != "ERRORED" ] \
                  && [ "$ADOPTED_STATUS" != "CANCELED" ]; then break; fi
                sleep 10
              done
              SUBMISSION_ID="$ADOPTED_ID"
            elif [ -z "$ADOPTED_ID" ]; then
              node scripts/production-release/release-transaction.mjs transition \
                --input /tmp/android-release-transaction.json \
                --output /tmp/android-release-transaction.json \
                --event intent --leg play --build-id "$AAB_BUILD_ID"
              persist_transaction
              set +e
              (cd apps/mobile && eas submit --platform android --profile production \
                --id "$AAB_BUILD_ID" --non-interactive --no-wait) \
                > /tmp/eas-submit-create.log 2>&1
              CREATE_EXIT=$?
              set -e
              cat /tmp/eas-submit-create.log
              # Incluso con salida no cero, la petición puede haberse creado en EAS.
              # Consultar y adoptar antes de permitir que otra ejecución la repita.
              for _ in 1 2 3 4 5 6; do
                list_submissions
                node scripts/production-release/eas-release.mjs select-submission \
                  --input /tmp/eas-submissions.json \
                  --build-id "$AAB_BUILD_ID" \
                  --track internal \
                  --release-status completed \
                  --output /tmp/eas-adopted-submission.json
                SUBMISSION_ID="$(jq -r '.id // empty' /tmp/eas-adopted-submission.json)"
                [ -n "$SUBMISSION_ID" ] && break
                sleep 10
              done
              if [ -z "$SUBMISSION_ID" ]; then
                node scripts/production-release/release-transaction.mjs transition \
                  --input /tmp/android-release-transaction.json \
                  --output /tmp/android-release-transaction.json \
                  --event fail --leg play \
                  --reason "No se confirmó la submission EAS (salida ${CREATE_EXIT}); requiere revisión y retry-failed."
                persist_transaction
                echo "::error::No se confirmó la submission; la intención durable impide repetirla automáticamente."
                exit 75
              fi
            fi
            if [ -z "$SUBMISSION_ID" ]; then SUBMISSION_ID="$ADOPTED_ID"; fi
            node scripts/production-release/release-transaction.mjs transition \
              --input /tmp/android-release-transaction.json \
              --output /tmp/android-release-transaction.json \
              --event submit --leg play \
              --build-id "$AAB_BUILD_ID" \
              --submission-id "$SUBMISSION_ID"
            persist_transaction
          fi
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      - name: Reconcile Play submission until EAS confirms it
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          SUBMISSION_ID: ${{ steps.submit-play.outputs.submission_id }}
          APP_ENV: production
        shell: bash
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if ! (cd apps/mobile && eas submit:view "$SUBMISSION_ID" --json \
              > /tmp/eas-submit-view.json 2> /tmp/eas-submit-view.err); then
              sleep 30
              continue
            fi
            STATUS="$(jq -r '.status | ascii_upcase' /tmp/eas-submit-view.json)"
            ARGS=(--input /tmp/android-release-transaction.json --output /tmp/android-release-transaction.json \
              --event observe --leg play --status "$STATUS")
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              ARGS+=(--reason "EAS Submit terminó en ${STATUS}; consulta submission ${SUBMISSION_ID}.")
            fi
            node scripts/production-release/release-transaction.mjs transition "${ARGS[@]}"
            gh release upload "$TAG" /tmp/android-release-transaction.json --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$STATUS" = "FINISHED" ]; then
              node scripts/production-release/eas-release.mjs play-evidence \
                --transaction /tmp/android-release-transaction.json \
                --submission /tmp/eas-submit-view.json \
                --output /tmp/production-play-evidence.json
              PLAY_EVIDENCE_SHA="$(sha256sum /tmp/production-play-evidence.json | cut -d' ' -f1)"
              VERSION_CODE="$(jq -r '.legs.aab.artifact.versionCode' /tmp/android-release-transaction.json)"
              node scripts/production-release/release-transaction.mjs transition \
                --input /tmp/android-release-transaction.json \
                --output /tmp/android-release-transaction.json \
                --event validate --leg play \
                --version-code "$VERSION_CODE" \
                --evidence-sha256 "$PLAY_EVIDENCE_SHA"
              gh release upload "$TAG" \
                /tmp/android-release-transaction.json \
                /tmp/production-play-evidence.json \
                --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "::error::Play Internal terminó en ${STATUS}; requiere retry-failed o supersede-failed con motivo."
              exit 1
            fi
            sleep 30
          done
          echo "::error::La espera local terminó; submission ${SUBMISSION_ID} queda persistida para reconciliar sin duplicar."
          tail -c 4000 /tmp/eas-submit-view.err >&2 || true
          exit 75

      - name: Write final GitHub release notes and workflow summary
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          VERSION: ${{ needs.select-transaction.outputs.version }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          AAB_ID="$(jq -r '.legs.aab.attempts[-1].buildId' /tmp/android-release-transaction.json)"
          APK_ID="$(jq -r '.legs.apk.attempts[-1].buildId' /tmp/android-release-transaction.json)"
          SUBMISSION_ID="$(jq -r '.legs.play.attempts[-1].submissionId' /tmp/android-release-transaction.json)"
          VERSION_CODE="$(jq -r '.legs.play.versionCode' /tmp/android-release-transaction.json)"
          AAB_SHA="$(jq -r '.legs.aab.artifact.sha256' /tmp/android-release-transaction.json)"
          APK_SHA="$(jq -r '.legs.apk.artifact.sha256' /tmp/android-release-transaction.json)"
          BODY_FILE="$(mktemp)"
          {
            echo "## Gymnasia ${VERSION}"
            echo
            echo "| Campo | Resultado |"
            echo "| --- | --- |"
            echo "| Commit | \`${SOURCE_COMMIT}\` |"
            echo "| Android | versionName \`${VERSION}\`, versionCode \`${VERSION_CODE}\` |"
            echo "| AAB | EAS \`${AAB_ID}\`, SHA-256 \`${AAB_SHA}\` |"
            echo "| APK | EAS \`${APK_ID}\`, SHA-256 \`${APK_SHA}\` |"
            echo "| Play | track \`internal\`, submission \`${SUBMISSION_ID}\`, estado \`FINISHED\` |"
            echo
            echo "### Changes"
            LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | sed -n '1p')"
            if [ -n "$LATEST_TAG" ]; then
              git log "$LATEST_TAG"..HEAD --max-count=30 --pretty=format:'- %s'
            fi
            echo
            echo
            echo "### Install"
            # shellcheck disable=SC2016
            echo 'Download `gymnasia.apk` for direct installation, or install the internal build through Google Play.'
          } > "$BODY_FILE"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$BODY_FILE"
          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify draft identity, both artifacts and Play evidence chain
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.select-transaction.outputs.release_id || steps.draft.outputs.release_id }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/github-release.json
          test "$(jq -r '.draft' /tmp/github-release.json)" = "true"
          test "$(jq -r '.target_commitish' /tmp/github-release.json)" = "$SOURCE_COMMIT"
          for ASSET in android-release-transaction.json production-source-evidence.json \
            production-aab-evidence.json production-apk-evidence.json production-play-evidence.json \
            gymnasia.aab gymnasia.apk; do
            jq -e --arg name "$ASSET" '.assets[] | select(.name == $name)' /tmp/github-release.json >/dev/null
          done
          ASSET_DIGEST() {
            jq -r --arg name "$1" '.assets[] | select(.name == $name) | .digest' /tmp/github-release.json
          }
          for LEG in aab apk; do
            POLICY="$(jq -c --arg leg "$LEG" '.artifacts[$leg]' .release-controller/scripts/production-release/policy.json)"
            ASSET="$(jq -c --arg name "gymnasia.${LEG}" '.assets[] | select(.name == $name)' /tmp/github-release.json)"
            test "$(jq -r '.content_type' <<<"$ASSET")" = "$(jq -r '.githubMimeType' <<<"$POLICY")"
            SIZE="$(jq -r '.size' <<<"$ASSET")"
            test "$SIZE" -ge "$(jq -r '.minBytes' <<<"$POLICY")"
            test "$SIZE" -le "$(jq -r '.maxBytes' <<<"$POLICY")"
            test "$(ASSET_DIGEST "gymnasia.${LEG}")" = "sha256:$(jq -r --arg leg "$LEG" '.legs[$leg].artifact.sha256' /tmp/android-release-transaction.json)"
            test "$(ASSET_DIGEST "production-${LEG}-evidence.json")" = "sha256:$(jq -r --arg leg "$LEG" '.legs[$leg].artifact.evidenceSha256' /tmp/android-release-transaction.json)"
            test "$(jq -r '.result' "/tmp/production-${LEG}-evidence.json")" = "passed"
          done
          test "$(ASSET_DIGEST production-play-evidence.json)" = "sha256:$(jq -r '.legs.play.evidenceSha256' /tmp/android-release-transaction.json)"
          test "$(jq -r '.state' /tmp/android-release-transaction.json)" = "validated"
          test "$(jq -r '.result' /tmp/production-play-evidence.json)" = "passed"
          test "$(jq -r '.artifact.versionCode' /tmp/production-aab-evidence.json)" = "$(jq -r '.artifact.versionCode' /tmp/production-apk-evidence.json)"
          test "$(ASSET_DIGEST production-source-evidence.json)" = "sha256:$(jq -r '.source.evidenceSha256' /tmp/production-aab-evidence.json)"
          test "$(jq -r '.source.evidenceSha256' /tmp/production-aab-evidence.json)" = "$(jq -r '.source.evidenceSha256' /tmp/production-apk-evidence.json)"

      - name: Publish immutable Android release
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Preserve actionable failure summary
        if: failure() && needs.select-transaction.outputs.action == 'build'
        shell: bash
        run: |
          {
            echo "## Android release stopped safely"
            echo
            echo "The GitHub Release remains a draft. Reconcile the same transaction; do not start a newer version."
            echo
            jq -r '"State: `\(.state)`; AAB: `\(.legs.aab.state)`; APK: `\(.legs.apk.state)`; Play: `\(.legs.play.state)`"' \
              /tmp/android-release-transaction.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  enqueue-next:
    needs: [select-transaction, build-and-release]
    if: needs.build-and-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Enqueue later committed version in semver order
        env:
          GH_TOKEN: ${{ github.token }}
          PROCESSED_VERSION: ${{ needs.select-transaction.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          # shellcheck disable=SC2016
          if node --input-type=module -e \
            'import { compareSemver } from "./scripts/production-release/production-release.mjs"; process.exit(compareSemver(process.argv[1], process.argv[2]) > 0 ? 0 : 1)' \
            "$CURRENT_VERSION" "$PROCESSED_VERSION"; then
            gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation=reconcile -f target_version= -f reason=
          fi
