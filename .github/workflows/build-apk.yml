name: Build Production APK & Publish Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile, retry or supersede the oldest failed version
        type: choice
        options: [reconcile, retry-failed, supersede-failed]
        default: reconcile
        required: true
      target_version:
        description: Required for retry/supersede (for example 1.31.3)
        type: string
        required: false
      reason:
        description: Required reason for retry/supersede
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/scripts/**"
      - "!apps/mobile/**/*.md"
      - "!apps/mobile/public/**"
      - "!apps/mobile/**/*.test.ts"
      - "!apps/mobile/**/*.test.tsx"

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  select-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.select.outputs.action }}
      mode: ${{ steps.select.outputs.mode }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
      source_commit: ${{ steps.select.outputs.source_commit }}

    steps:
      - name: Require protected main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select oldest durable transaction
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          TARGET_VERSION: ${{ inputs.target_version || '' }}
          REASON: ${{ inputs.reason || '' }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          node scripts/production-release/release-transaction.mjs select-remote \
            --current-version "$CURRENT_VERSION" \
            --current-commit "$CURRENT_COMMIT" \
            --operation "$OPERATION" \
            --target-version "$TARGET_VERSION" \
            --reason "$REASON" \
            --output /tmp/production-release-selection.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve transaction selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-transaction-selection-${{ github.run_id }}
          path: /tmp/production-release-selection.json
          if-no-files-found: error
          retention-days: 30

  validate-production:
    needs: select-transaction
    if: needs.select-transaction.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout exact Production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select-transaction.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Production E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate exact source and re-run every Production gate
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-source -- \
            --profile production-apk \
            --artifact-type apk \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-version "${{ needs.select-transaction.outputs.version }}" \
            --output /tmp/production-source-evidence.json
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-source-${{ needs.select-transaction.outputs.version }}
          path: /tmp/production-source-evidence.json
          if-no-files-found: warn
          retention-days: 30

  build-and-release:
    needs: [select-transaction, validate-production]
    if: >-
      always() &&
      needs.select-transaction.result == 'success' &&
      (needs.select-transaction.outputs.action == 'supersede' ||
       (needs.select-transaction.outputs.action == 'build' && needs.validate-production.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Production
    permissions:
      contents: write

    steps:
      - name: Checkout immutable transaction source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select-transaction.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Restore transaction selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-transaction-selection-${{ github.run_id }}
          path: /tmp/selection

      - name: Materialize transaction
        run: jq '.transaction' /tmp/selection/production-release-selection.json > /tmp/android-release-transaction.json

      - name: Apply authorized retry or supersession
        if: needs.select-transaction.outputs.mode == 'retry' || needs.select-transaction.outputs.mode == 'supersede'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          MODE: ${{ needs.select-transaction.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          REASON="$(jq -r '.reason' /tmp/selection/production-release-selection.json)"
          node scripts/production-release/release-transaction.mjs transition \
            --input /tmp/android-release-transaction.json \
            --output /tmp/android-release-transaction.json \
            --event "$MODE" \
            --reason "$REASON"
          gh release upload "$TAG" /tmp/android-release-transaction.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Stop after recording supersession
        if: needs.select-transaction.outputs.action == 'supersede'
        run: echo "La versión fallida quedó sustituida con un motivo auditable."

      - name: Install dependencies
        if: needs.select-transaction.outputs.action == 'build'
        run: npm ci

      - name: Restore verified source evidence
        if: needs.select-transaction.outputs.action == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-source-${{ needs.select-transaction.outputs.version }}
          path: /tmp/source

      - name: Prepare new immutable policy inputs
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/policy-promotion/prepare-policy-snapshot.mjs \
            --environment production \
            --github-env "$GITHUB_ENV"
          cp apps/mobile/agent/generated/policySnapshot.generated.json /tmp/production-policy-snapshot.json
          tar -czf /tmp/production-policy-bundle.tar.gz \
            apps/mobile/agent/generated/chatSystemPrompt.generated.ts \
            apps/mobile/agent/generated/healthSafetyPolicy.generated.ts \
            apps/mobile/agent/generated/policySnapshot.generated.json \
            apps/mobile/agent/generated/signedPolicySnapshot.generated.ts

      - name: Restore immutable policy inputs
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern production-policy-snapshot.json \
            --pattern production-policy-bundle.tar.gz \
            --dir /tmp/policy
          cp /tmp/policy/production-policy-snapshot.json /tmp/production-policy-snapshot.json
          cp /tmp/policy/production-policy-bundle.tar.gz /tmp/production-policy-bundle.tar.gz
          tar -xzf /tmp/production-policy-bundle.tar.gz -C .
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const p = require("/tmp/production-policy-snapshot.json");
            fs.appendFileSync(process.env.GITHUB_ENV,
              `APP_ENV=production\nPOLICY_CANDIDATE=${p.candidate}\nPOLICY_SHA256=${p.sha256}\nPOLICY_DEPLOYMENT_ID=${p.deploymentId}\n`);
          '

      - name: Create durable draft before EAS
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          VERSION: ${{ needs.select-transaction.outputs.version }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          TRANSACTION_BASE64="$(base64 < /tmp/android-release-transaction.json | tr -d '\n')"
          {
            echo "## Gymnasia ${VERSION}"
            echo
            echo "Transacción Android durable para el commit \`${SOURCE_COMMIT}\`."
            echo
            echo "<!-- android-release-transaction:${TRANSACTION_BASE64} -->"
            echo "### Changes"
            LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -1)"
            if [ -n "$LATEST_TAG" ]; then
              git log "$LATEST_TAG"..HEAD --pretty=format:'- %s' | head -30
            fi
            echo
            echo "### Install"
            # shellcheck disable=SC2016
            echo 'Download `gymnasia.apk` and install it on Android.'
          } > "$BODY_FILE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --title "Gymnasia ${VERSION}" \
            --notes-file "$BODY_FILE" --draft
          gh release upload "$TAG" \
            /tmp/android-release-transaction.json \
            /tmp/source/production-source-evidence.json \
            /tmp/production-policy-snapshot.json \
            /tmp/production-policy-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Refresh durable source evidence
        if: needs.select-transaction.outputs.action == 'build' && needs.select-transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: |
          gh release upload "$TAG" /tmp/source/production-source-evidence.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Setup EAS CLI
        if: needs.select-transaction.outputs.action == 'build'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Adopt or submit exactly one EAS build
        if: needs.select-transaction.outputs.action == 'build'
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          VERSION: ${{ needs.select-transaction.outputs.version }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(jq -r '.attempts[-1].buildId // empty' /tmp/android-release-transaction.json)"
          if [ -z "$BUILD_ID" ] || [ "$(jq -r '.state' /tmp/android-release-transaction.json)" = "prepared" ]; then
            cd apps/mobile
            eas build:list --platform android --build-profile production-apk \
              --app-version "$VERSION" --git-commit-hash "$SOURCE_COMMIT" \
              --limit 50 --json > /tmp/eas-candidates.json
            cd - >/dev/null
            mapfile -t ADOPTABLE < <(jq -r \
              --arg message "android-v${VERSION}" \
              '.[] | select(.message == $message and (.status != "ERRORED" and .status != "CANCELED")) | .id' \
              /tmp/eas-candidates.json)
            if [ "${#ADOPTABLE[@]}" -gt 1 ]; then
              echo "::error::Hay varios builds EAS adoptables para la misma transacción."
              exit 1
            elif [ "${#ADOPTABLE[@]}" -eq 1 ]; then
              BUILD_ID="${ADOPTABLE[0]}"
            else
              cd apps/mobile
              eas build --platform android --profile production-apk \
                --message "android-v${VERSION}" --non-interactive --no-wait --json \
                > /tmp/eas-submission.json
              cd - >/dev/null
              BUILD_ID="$(jq -r 'if type == "array" then .[0].id else .id end // empty' /tmp/eas-submission.json)"
            fi
            test -n "$BUILD_ID" || { echo "::error::EAS no devolvió un build ID."; exit 1; }
            node scripts/production-release/release-transaction.mjs transition \
              --input /tmp/android-release-transaction.json \
              --output /tmp/android-release-transaction.json \
              --event submit --build-id "$BUILD_ID"
            gh release upload "$TAG" /tmp/android-release-transaction.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Reconcile EAS until terminal state
        if: needs.select-transaction.outputs.action == 'build'
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 6300))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if ! (cd apps/mobile && eas build:view "$BUILD_ID" --json > /tmp/eas-view.json); then
              sleep 30
              continue
            fi
            STATUS="$(jq -r '.status' /tmp/eas-view.json)"
            APK_URL="$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' /tmp/eas-view.json)"
            ARGS=(--input /tmp/android-release-transaction.json --output /tmp/android-release-transaction.json --event observe --status "$STATUS")
            if [ -n "$APK_URL" ]; then ARGS+=(--artifact-url "$APK_URL"); fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              ARGS+=(--reason "EAS terminó en ${STATUS}")
            fi
            node scripts/production-release/release-transaction.mjs transition "${ARGS[@]}"
            gh release upload "$TAG" /tmp/android-release-transaction.json \
              --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$STATUS" = "FINISHED" ]; then
              echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "::error::EAS terminó en ${STATUS}; solo se reintentará manualmente y con motivo."
              exit 1
            fi
            sleep 30
          done
          echo "::error::La espera local terminó; la transacción conserva el build ID y puede reconciliarse sin recompilar."
          exit 75

      - name: Download APK to quarantine path
        if: needs.select-transaction.outputs.action == 'build'
        id: download
        env:
          APK_URL: ${{ steps.build.outputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_URL" || { echo "::error::EAS no devolvió una URL de artefacto."; exit 1; }
          curl --fail --location --dump-header /tmp/apk-response.headers \
            "$APK_URL" --output /tmp/gymnasia.apk.download
          HTTP_MIME="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); value=$2} END{print value}' /tmp/apk-response.headers)"
          test -n "$HTTP_MIME" || { echo "::error::La descarga no declaró Content-Type."; exit 1; }
          echo "http_mime=$HTTP_MIME" >> "$GITHUB_OUTPUT"

      - name: Expose Android artifact tools
        if: needs.select-transaction.outputs.action == 'build'
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ANDROID_BUILD_TOOLS"
          echo "$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify quarantined Production APK
        if: needs.select-transaction.outputs.action == 'build'
        env:
          HTTP_MIME: ${{ steps.download.outputs.http_mime }}
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-artifact -- \
            --artifact /tmp/gymnasia.apk.download \
            --published-filename gymnasia.apk \
            --http-mime "$HTTP_MIME" \
            --kind apk \
            --source-evidence /tmp/source/production-source-evidence.json \
            --snapshot /tmp/production-policy-snapshot.json \
            --build-metadata /tmp/eas-view.json \
            --output /tmp/production-artifact-evidence.json
          mv /tmp/gymnasia.apk.download gymnasia.apk

      - name: Mark transaction validated
        if: needs.select-transaction.outputs.action == 'build'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_SHA="$(jq -r '.artifact.sha256' /tmp/production-artifact-evidence.json)"
          ARTIFACT_SIZE="$(jq -r '.artifact.size' /tmp/production-artifact-evidence.json)"
          EVIDENCE_SHA="$(sha256sum /tmp/production-artifact-evidence.json | cut -d' ' -f1)"
          node scripts/production-release/release-transaction.mjs transition \
            --input /tmp/android-release-transaction.json \
            --output /tmp/android-release-transaction.json \
            --event validate \
            --artifact-sha256 "$ARTIFACT_SHA" \
            --artifact-size "$ARTIFACT_SIZE" \
            --evidence-sha256 "$EVIDENCE_SHA"

      - name: Attach verified APK and immutable evidence
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            /tmp/android-release-transaction.json \
            /tmp/source/production-source-evidence.json \
            /tmp/production-artifact-evidence.json \
            /tmp/production-policy-snapshot.json \
            /tmp/production-policy-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /tmp/github-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/github-release.json)"
          EXISTING_APK_ID="$(jq -r '.assets[] | select(.name == "gymnasia.apk") | .id' /tmp/github-release.json)"
          if [ -n "$EXISTING_APK_ID" ]; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${EXISTING_APK_ID}"
          fi
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary @gymnasia.apk \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=gymnasia.apk" \
            > /tmp/github-apk-asset.json

      - name: Verify draft identity, bounds and MIME
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.select-transaction.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /tmp/github-release.json
          test "$(jq -r '.draft' /tmp/github-release.json)" = "true"
          test "$(jq -r '.target_commitish' /tmp/github-release.json)" = "$SOURCE_COMMIT"
          APK_POLICY="$(jq -c '.artifacts.apk' scripts/production-release/policy.json)"
          APK="$(jq -c '.assets[] | select(.name == "gymnasia.apk")' /tmp/github-release.json)"
          test "$(jq -r '.content_type' <<<"$APK")" = "$(jq -r '.githubMimeType' <<<"$APK_POLICY")"
          APK_SIZE="$(jq -r '.size' <<<"$APK")"
          test "$APK_SIZE" -ge "$(jq -r '.minBytes' <<<"$APK_POLICY")"
          test "$APK_SIZE" -le "$(jq -r '.maxBytes' <<<"$APK_POLICY")"
          for ASSET in android-release-transaction.json production-source-evidence.json production-artifact-evidence.json; do
            jq -e --arg name "$ASSET" '.assets[] | select(.name == $name)' /tmp/github-release.json >/dev/null
          done

      - name: Publish immutable APK release
        if: needs.select-transaction.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select-transaction.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  enqueue-next:
    needs: [select-transaction, build-and-release]
    if: needs.build-and-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Enqueue later committed version in semver order
        env:
          GH_TOKEN: ${{ github.token }}
          PROCESSED_VERSION: ${{ needs.select-transaction.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          if node --input-type=module -e \
            'import { compareSemver } from "./scripts/production-release/production-release.mjs"; process.exit(compareSemver(process.argv[1], process.argv[2]) > 0 ? 0 : 1)' \
            "$CURRENT_VERSION" "$PROCESSED_VERSION"; then
            gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation=reconcile -f target_version= -f reason=
          fi
