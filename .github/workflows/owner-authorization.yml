name: Owner authorization

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional pull request number to reconcile immediately"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  deployments: read
  statuses: write

concurrency:
  group: owner-authorization-${{ github.event.pull_request.number || inputs.pr_number || 'all' }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base policy only
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$TRUSTED_SHA"
          git checkout --detach FETCH_HEAD

      - name: Reconcile owner authorization statuses
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/prompt-policy/reconcile-owner-authorization.mjs
