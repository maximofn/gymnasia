name: Agent deterministic tests

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/feedback-worker/**"
      - "apps/anthropic_proxy/**"
      - "prompts/**"
      - "policy/health-safety/**"
      - "scripts/health-safety/**"
      - "scripts/dev-store/**"
      - "scripts/mobile-boundaries/**"
      - "docs/ai-transparency.md"
      - "docs/architecture/health-safety-policy.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-tests.yml"
      - ".github/workflows/openwiki-*.yml"
      - "docs/openwiki-automation.md"
      - "ops/openwiki-automation-template/**"
      - "ops/android-build/**"
      - "scripts/production-release/**"
      - ".github/workflows/build-apk.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/feedback-worker/**"
      - "apps/anthropic_proxy/**"
      - "prompts/**"
      - "policy/health-safety/**"
      - "scripts/health-safety/**"
      - "scripts/dev-store/**"
      - "scripts/mobile-boundaries/**"
      - "docs/ai-transparency.md"
      - "docs/architecture/health-safety-policy.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-tests.yml"
      - ".github/workflows/openwiki-*.yml"
      - "docs/openwiki-automation.md"
      - "ops/openwiki-automation-template/**"
      - "ops/android-build/**"
      - "scripts/production-release/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository without traversing legacy gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled chat prompt snapshot
        run: npm run check:chat-prompt

      - name: Verify canonical health safety policy and bundled prompt
        run: npm run check:health-safety

      - name: Run health safety deterministic tests
        run: npm run test:health-safety

      - name: Run deterministic agent suite
        run: npm test

      - name: Verify mobile architecture boundaries
        run: npm run check:mobile-boundaries

      - name: Run protected dev-store Metro E2E
        run: npm run test:dev-store:e2e

      - name: Run feedback worker suite
        run: npm --workspace apps/feedback-worker run test

      - name: Run OpenWiki automation tests
        run: npm run test:openwiki

      - name: Verify Android release transactions and workflow
        run: npm run test:production-release

      - name: Type-check mobile app
        run: npm --workspace apps/mobile exec tsc --noEmit

  # Los controladores operativos se prueban sin credenciales ni acceso al host.
  # Se mantienen separados del runtime móvil y de la suite del proxy.
  android-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test provisioning, registration and bounded transport without network
        run: |
          /usr/bin/python3 ops/android-build/provision-test.py
          /usr/bin/python3 ops/android-build/registration-test.py
          /usr/bin/python3 ops/android-build/smoke-channel-test.py
          bash -n ops/android-build/install-controller.sh

  # El proxy conserva su job Python independiente, sin npm ci.
  anthropic-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository without traversing legacy gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: pipx install uv==0.7.14

      - name: Run Anthropic proxy suite
        run: uv run --project apps/anthropic_proxy --extra dev pytest apps/anthropic_proxy
