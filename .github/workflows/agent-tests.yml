name: Agent deterministic tests

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/feedback-worker/**"
      - "prompts/**"
      - "policy/health-safety/**"
      - "scripts/health-safety/**"
      - "scripts/dev-store/**"
      - "docs/ai-transparency.md"
      - "docs/architecture/health-safety-policy.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-tests.yml"
      - ".github/workflows/openwiki-*.yml"
      - "docs/openwiki-automation.md"
      - "ops/openwiki-automation-template/**"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/feedback-worker/**"
      - "prompts/**"
      - "policy/health-safety/**"
      - "scripts/health-safety/**"
      - "scripts/dev-store/**"
      - "docs/ai-transparency.md"
      - "docs/architecture/health-safety-policy.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-tests.yml"
      - ".github/workflows/openwiki-*.yml"
      - "docs/openwiki-automation.md"
      - "ops/openwiki-automation-template/**"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository without traversing legacy gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled chat prompt snapshot
        run: npm run check:chat-prompt

      - name: Verify canonical health safety policy and bundled prompt
        run: npm run check:health-safety

      - name: Run health safety deterministic tests
        run: npm run test:health-safety

      - name: Run deterministic agent suite
        run: npm test

      - name: Run protected dev-store Metro E2E
        run: npm run test:dev-store:e2e

      - name: Run feedback worker suite
        run: npm --workspace apps/feedback-worker run test

      - name: Run OpenWiki automation tests
        run: npm run test:openwiki

      - name: Type-check mobile app
        run: npm --workspace apps/mobile exec tsc --noEmit
