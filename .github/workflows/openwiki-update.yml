name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history without traversing legacy gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags origin "$GITHUB_REF"
          git checkout --force -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Check model credentials
        id: model_auth
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OpenWiki update skipped: configure OPENROUTER_API_KEY or use the separate private automation repository documented in docs/openwiki-automation.md. ChatGPT OAuth must not be stored in this public repository."
          fi

      - name: Set up Node.js
        if: steps.model_auth.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"

      - name: Install locked OpenWiki dependencies
        if: steps.model_auth.outputs.enabled == 'true'
        run: npm ci --prefix ops/openwiki-automation-template

      - name: Run OpenWiki
        if: steps.model_auth.outputs.enabled == 'true'
        run: ops/openwiki-automation-template/node_modules/.bin/openwiki code --update --language es --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          # Required for the LangSmith connector's code-mode pull to authenticate.
          # For extra workspaces, add OPENWIKI_LANGSMITH_API_KEY_2, _3, ... as repo
          # secrets and env entries here.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"
          LANGSMITH_HIDE_INPUTS: "true"
          LANGSMITH_HIDE_OUTPUTS: "true"
          LANGSMITH_HIDE_METADATA: "true"

      - name: Create OpenWiki update pull request
        if: steps.model_auth.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            .openwikiignore
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
