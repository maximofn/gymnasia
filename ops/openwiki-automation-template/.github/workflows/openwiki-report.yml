name: OpenWiki Daily Report

on:
  workflow_dispatch:
  schedule:
    # Four hours after the update so this workflow can report a missing,
    # queued, failed, or OAuth-expired run independently.
    - cron: "0 12 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: openwiki-daily-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Telegram configuration
        id: telegram
        shell: bash
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "private" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::This workflow must run from a private repository."
          elif [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Daily report skipped: configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID."
          fi

      - name: Check out private automation repository
        if: steps.telegram.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.telegram.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"

      - name: Send sanitized daily OpenWiki report
        if: steps.telegram.outputs.enabled == 'true'
        shell: bash
        env:
          AUTOMATION_GH_TOKEN: ${{ github.token }}
          GYMNASIA_REPO_TOKEN: ${{ secrets.GYMNASIA_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          sent=false
          send_telegram() {
            local message="$1"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${message}" \
              --data-urlencode "disable_web_page_preview=true" > /dev/null
          }

          send_telegram_file() {
            local report_file="$1"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@${report_file}" \
              --data-urlencode "disable_web_page_preview=true" > /dev/null
          }

          report_internal_failure() {
            local exit_code="$?"
            trap - EXIT
            if [ "$exit_code" -ne 0 ] && [ "$sent" != "true" ]; then
              send_telegram "🔴 OpenWiki Gymnasia: no se pudo generar el informe diario. Revisa https://github.com/${GITHUB_REPOSITORY}/actions/workflows/openwiki-report.yml" || true
            fi
            exit "$exit_code"
          }
          trap report_internal_failure EXIT

          runs_path="$RUNNER_TEMP/openwiki-runs.json"
          jobs_path="$RUNNER_TEMP/openwiki-jobs.json"
          pull_requests_path="$RUNNER_TEMP/openwiki-pull-requests.json"
          report_path="$RUNNER_TEMP/openwiki-daily-report.txt"

          GH_TOKEN="$AUTOMATION_GH_TOKEN" \
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/openwiki-update.yml/runs?per_page=30" \
              > "$runs_path"
          run_id="$(jq -r '.workflow_runs[0].id // empty' "$runs_path")"
          if [ -n "$run_id" ]; then
            GH_TOKEN="$AUTOMATION_GH_TOKEN" \
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                > "$jobs_path"
          else
            printf '%s\n' '{"jobs":[]}' > "$jobs_path"
          fi

          if [ -n "$GYMNASIA_REPO_TOKEN" ]; then
            GH_TOKEN="$GYMNASIA_REPO_TOKEN" \
              gh pr list --repo maximofn/gymnasia --state all \
                --head openwiki/update --limit 1 \
                --json additions,changedFiles,deletions,files,mergedAt,number,state,updatedAt,url \
                  > "$pull_requests_path"
          else
            printf '%s\n' '[]' > "$pull_requests_path"
          fi

          node scripts/build-daily-report.mjs \
            "$runs_path" "$jobs_path" "$pull_requests_path" "$report_path"
          send_telegram_file "$report_path"
          sent=true
